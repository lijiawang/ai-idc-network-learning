<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 819" width="1920" height="819">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020817" stop-opacity="0.96"/>
      <stop offset="0.38" stop-color="#020817" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#020817" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817" stop-opacity="0"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#72e5ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <style>
      text {
        font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }
      .badge {
        font-size: 24px;
        font-weight: 500;
        fill: #b9efff;
      }
      .title {
        font-size: 118px;
        font-weight: 900;
        fill: url(#titleGrad);
      }
      .subtitle {
        font-size: 50px;
        font-weight: 700;
        fill: #f0f9ff;
      }
      .pill {
        font-size: 30px;
        font-weight: 600;
        fill: #e0f7ff;
      }
      .caption {
        font-size: 28px;
        font-weight: 400;
        fill: #b8d9ea;
      }
    </style>
  </defs>

  <image href="微信公众号封面-All-to-All-MoE-无字底图.png" x="0" y="-1" width="1920" height="821" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1920" height="819" fill="url(#leftShade)"/>
  <rect x="0" y="0" width="1920" height="819" fill="url(#bottomShade)"/>

  <path d="M44 118 L44 42 L210 42" stroke="#149bd7" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M44 700 L44 777 L210 777" stroke="#149bd7" stroke-width="2" fill="none" opacity="0.85"/>

  <rect x="92" y="92" width="318" height="38" rx="4" fill="#04121e" fill-opacity="0.62" stroke="#2dd4ff" stroke-width="1.4"/>
  <text x="110" y="119" class="badge">MOE COMMUNICATION</text>
  <line x1="92" y1="152" x2="654" y2="152" stroke="#2dd4ff" stroke-width="3" opacity="0.88"/>
  <line x1="92" y1="158" x2="422" y2="158" stroke="#f59e0b" stroke-width="2.2" opacity="0.92"/>

  <text x="92" y="292" class="title" filter="url(#softGlow)">All-to-All</text>
  <text x="96" y="398" class="subtitle" filter="url(#textShadow)">MoE 专家派送系统</text>

  <rect x="92" y="452" width="524" height="64" rx="7" fill="#06111d" fill-opacity="0.72" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="116" y="493" class="pill">Dispatch + Combine</text>
  <rect x="500" y="474" width="18" height="18" rx="3" fill="#f59e0b"/>
  <rect x="530" y="474" width="18" height="18" rx="3" fill="#34d399"/>
  <rect x="560" y="474" width="18" height="18" rx="3" fill="#38bdf8"/>

  <text x="94" y="614" class="caption" filter="url(#textShadow)">router 分桶 · 多对多派送 · token 在路上</text>
</svg>
