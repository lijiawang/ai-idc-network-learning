<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="727" viewBox="0 0 1200 727">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#172236" stroke-width=".7"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#a78bfa"/>
    </marker>
    <style>
      text { font-family: "JetBrains Mono", "PingFang SC", "Microsoft YaHei", monospace; }
      .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .eyebrow { fill: #76b900; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .lane-title { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
      .box-title { fill: #f8fafc; font-size: 13px; font-weight: 700; }
      .box-subtitle { fill: #94a3b8; font-size: 9px; }
      .step-label { fill: #cbd5e1; font-size: 9px; font-weight: 600; }
      .step-number { fill: #07101f; font-size: 10px; font-weight: 700; }
      .note-title { fill: #f8fafc; font-size: 11px; font-weight: 700; }
      .note { fill: #94a3b8; font-size: 9px; }
      line, path { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="727" rx="18" fill="#07101f"/>
  <rect x="1" y="1" width="1198" height="725" rx="17" fill="none" stroke="#26344c" stroke-width="2"/>
  <rect x="20" y="76" width="1160" height="624" fill="url(#grid)"/>

  <text x="30" y="43" class="eyebrow">FIGURE 02</text>
  <text x="142" y="43" class="title">一个 GPU 任务是怎样跑起来的？</text>
  <text x="1165" y="43" fill="#94a3b8" font-size="10" text-anchor="end">沿编号阅读：先选机器，再选机器里的 GPU</text>

  <!-- Two independent swimlanes -->
  <rect x="55" y="110" width="1090" height="220" rx="16" fill="#081322" fill-opacity=".82"
        stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="78" y="140" fill="#22d3ee" class="lane-title">第一阶段 · KUBERNETES 控制面</text>
  <text x="330" y="140" fill="#94a3b8" font-size="9">决定任务在哪台机器运行</text>

  <rect x="55" y="370" width="1090" height="220" rx="16" fill="#0b1321" fill-opacity=".82"
        stroke="#34d399" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="78" y="400" fill="#34d399" class="lane-title">第二阶段 · GPU 节点</text>
  <text x="265" y="400" fill="#94a3b8" font-size="9">选择这台机器里的具体 GPU，并启动容器</text>

  <!-- All arrows are drawn before boxes -->
  <!-- Control plane, strictly left to right -->
  <line x1="280" y1="230" x2="344" y2="230" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>
  <line x1="560" y1="230" x2="624" y2="230" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>
  <line x1="840" y1="230" x2="904" y2="230" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>

  <!-- Direct vertical handoff to the same node's kubelet -->
  <line x1="1012" y1="278" x2="1012" y2="434" stroke="#a78bfa" stroke-width="2.2"
        marker-end="url(#arrow-violet)"/>

  <!-- Node lane returns right to left, forming one continuous U-shaped flow -->
  <line x1="904" y1="490" x2="840" y2="490" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <line x1="624" y1="490" x2="560" y2="490" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <line x1="344" y1="490" x2="280" y2="490" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-green)"/>

  <!-- Control-plane boxes -->
  <rect x="80" y="182" width="200" height="96" rx="10" fill="#0f172a"/>
  <rect x="80" y="182" width="200" height="96" rx="10" fill="#083344" fill-opacity=".46"
        stroke="#22d3ee" stroke-width="2"/>
  <text x="180" y="215" class="box-title" text-anchor="middle">提交 GPU 任务</text>
  <text x="180" y="240" class="box-subtitle" text-anchor="middle">Pod YAML</text>
  <text x="180" y="259" fill="#22d3ee" font-size="9" text-anchor="middle">申请 1 块 GPU</text>

  <rect x="344" y="182" width="216" height="96" rx="10" fill="#0f172a"/>
  <rect x="344" y="182" width="216" height="96" rx="10" fill="#2e1065" fill-opacity=".34"
        stroke="#a78bfa" stroke-width="2"/>
  <text x="452" y="215" class="box-title" text-anchor="middle">接收并保存任务</text>
  <text x="452" y="240" class="box-subtitle" text-anchor="middle">Kubernetes API Server</text>
  <text x="452" y="258" fill="#64748b" font-size="8" text-anchor="middle">此时还没有选择运行节点</text>

  <rect x="624" y="182" width="216" height="96" rx="10" fill="#0f172a"/>
  <rect x="624" y="182" width="216" height="96" rx="10" fill="#2e1065" fill-opacity=".34"
        stroke="#a78bfa" stroke-width="2"/>
  <text x="732" y="215" class="box-title" text-anchor="middle">选择一台 GPU 节点</text>
  <text x="732" y="240" class="box-subtitle" text-anchor="middle">Scheduler 调度器</text>
  <text x="732" y="258" fill="#a78bfa" font-size="8" text-anchor="middle">只看剩余 GPU 数量，不选择具体卡</text>

  <rect x="904" y="182" width="216" height="96" rx="10" fill="#0f172a"/>
  <rect x="904" y="182" width="216" height="96" rx="10" fill="#083344" fill-opacity=".4"
        stroke="#22d3ee" stroke-width="2"/>
  <text x="1012" y="215" class="box-title" text-anchor="middle">确定目标机器</text>
  <text x="1012" y="240" class="box-subtitle" text-anchor="middle">例如 gpu-01 或 gpu-02</text>
  <text x="1012" y="258" fill="#22d3ee" font-size="8" text-anchor="middle">把任务交给该节点的 kubelet</text>

  <!-- Node-lane boxes -->
  <rect x="904" y="438" width="216" height="104" rx="10" fill="#0f172a"/>
  <rect x="904" y="438" width="216" height="104" rx="10" fill="#083344" fill-opacity=".4"
        stroke="#22d3ee" stroke-width="2"/>
  <text x="1012" y="472" class="box-title" text-anchor="middle">节点代理 kubelet</text>
  <text x="1012" y="497" class="box-subtitle" text-anchor="middle">开始创建 Pod</text>
  <text x="1012" y="515" fill="#22d3ee" font-size="8" text-anchor="middle">向设备插件申请 1 块 GPU</text>

  <rect x="624" y="438" width="216" height="104" rx="10" fill="#0f172a"/>
  <rect x="624" y="438" width="216" height="104" rx="10" fill="#064e3b" fill-opacity=".38"
        stroke="#34d399" stroke-width="2"/>
  <text x="732" y="472" class="box-title" text-anchor="middle">挑选一块健康 GPU</text>
  <text x="732" y="497" class="box-subtitle" text-anchor="middle">NVIDIA Device Plugin</text>
  <text x="732" y="515" fill="#34d399" font-size="8" text-anchor="middle">这里才确定具体 GPU UUID</text>

  <rect x="344" y="438" width="216" height="104" rx="10" fill="#0f172a"/>
  <rect x="344" y="438" width="216" height="104" rx="10" fill="#064e3b" fill-opacity=".38"
        stroke="#34d399" stroke-width="2"/>
  <text x="452" y="472" class="box-title" text-anchor="middle">把 GPU 交给容器</text>
  <text x="452" y="497" class="box-subtitle" text-anchor="middle">containerd + NVIDIA Toolkit</text>
  <text x="452" y="515" fill="#34d399" font-size="8" text-anchor="middle">注入设备并挂载驱动库</text>

  <rect x="80" y="438" width="200" height="104" rx="10" fill="#0f172a"/>
  <rect x="80" y="438" width="200" height="104" rx="10" fill="#365314" fill-opacity=".4"
        stroke="#76b900" stroke-width="2"/>
  <text x="180" y="472" class="box-title" text-anchor="middle">CUDA 应用运行</text>
  <text x="180" y="497" class="box-subtitle" text-anchor="middle">Pod 获得 GPU 访问能力</text>
  <text x="180" y="515" fill="#76b900" font-size="8" text-anchor="middle">开始训练或推理</text>

  <!-- Step markers and labels -->
  <g>
    <circle cx="312" cy="209" r="13" fill="#22d3ee"/><text x="312" y="213" class="step-number" text-anchor="middle">1</text>
    <text x="312" y="256" class="step-label" text-anchor="middle">创建任务</text>

    <circle cx="592" cy="209" r="13" fill="#22d3ee"/><text x="592" y="213" class="step-number" text-anchor="middle">2</text>
    <text x="592" y="256" class="step-label" text-anchor="middle">等待调度</text>

    <circle cx="872" cy="209" r="13" fill="#22d3ee"/><text x="872" y="213" class="step-number" text-anchor="middle">3</text>
    <text x="872" y="256" class="step-label" text-anchor="middle">绑定节点</text>

    <circle cx="1038" cy="350" r="13" fill="#a78bfa"/><text x="1038" y="354" class="step-number" text-anchor="middle">4</text>
    <rect x="874" y="335" width="124" height="30" rx="6" fill="#07101f"/>
    <text x="936" y="355" fill="#a78bfa" class="step-label" text-anchor="middle">下发任务</text>

    <circle cx="872" cy="469" r="13" fill="#34d399"/><text x="872" y="473" class="step-number" text-anchor="middle">5</text>
    <text x="872" y="516" class="step-label" text-anchor="middle">申请设备</text>

    <circle cx="592" cy="469" r="13" fill="#34d399"/><text x="592" y="473" class="step-number" text-anchor="middle">6</text>
    <text x="592" y="516" class="step-label" text-anchor="middle">注入 GPU</text>

    <circle cx="312" cy="469" r="13" fill="#76b900"/><text x="312" y="473" class="step-number" text-anchor="middle">7</text>
    <text x="312" y="516" class="step-label" text-anchor="middle">启动应用</text>
  </g>

  <!-- Key boundary -->
  <rect x="145" y="620" width="910" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.4"/>
  <text x="600" y="644" class="note-title" text-anchor="middle">关键边界</text>
  <text x="600" y="664" class="note" text-anchor="middle">Scheduler 决定“哪台节点”；目标节点的 kubelet 与 Device Plugin 决定“哪块 GPU”</text>
</svg>
