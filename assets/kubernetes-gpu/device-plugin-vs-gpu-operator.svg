<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="operatorHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17370f"/>
      <stop offset=".55" stop-color="#102a17"/>
      <stop offset="1" stop-color="#0b1d18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#172236" stroke-width=".7"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family:"JetBrains Mono","PingFang SC","Microsoft YaHei",monospace; }
      .title { fill:#f8fafc; font-size:23px; font-weight:700; }
      .eyebrow { fill:#76b900; font-size:13px; font-weight:700; letter-spacing:2px; }
      .operator-title { fill:#f8fafc; font-size:25px; font-weight:700; }
      .operator-sub { fill:#cbd5e1; font-size:10px; }
      .card-title { fill:#f8fafc; font-size:12px; font-weight:700; }
      .card-main { fill:#f8fafc; font-size:10px; font-weight:700; }
      .card-sub { fill:#94a3b8; font-size:8px; }
      .tiny { fill:#94a3b8; font-size:7.5px; }
      .tag { font-size:8px; font-weight:700; }
      rect, path, line { shape-rendering:geometricPrecision; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="760" rx="18" fill="#07101f"/>
  <rect x="1" y="1" width="1198" height="758" rx="17" fill="none" stroke="#26344c" stroke-width="2"/>
  <rect x="20" y="72" width="1160" height="658" fill="url(#grid)"/>

  <!-- Header -->
  <text x="30" y="43" class="eyebrow">FIGURE 02</text>
  <text x="142" y="43" class="title">一眼看懂：GPU Operator 管什么？</text>
  <text x="1165" y="43" fill="#94a3b8" font-size="10" text-anchor="end">Device Plugin 只是其中一个组件</text>

  <!-- One large visual container: everything inside is managed by GPU Operator -->
  <rect x="50" y="105" width="1100" height="425" rx="20" fill="#0b1020" stroke="#76b900" stroke-width="2.5"/>
  <path d="M70 105H1130Q1150 105 1150 125V195H50V125Q50 105 70 105Z" fill="url(#operatorHeader)"/>
  <line x1="50" y1="195" x2="1150" y2="195" stroke="#315c20" stroke-width="1.5"/>

  <!-- Operator heading -->
  <circle cx="94" cy="150" r="20" fill="#76b900"/>
  <path d="M84 150H104M94 140V160M87 143L101 157M101 143L87 157" stroke="#07101f" stroke-width="2.2"/>
  <text x="130" y="145" class="operator-title">GPU Operator 管理范围</text>
  <text x="130" y="169" class="operator-sub">外层管理者：统一安装 · 配置 · 升级 · 健康检查</text>

  <rect x="820" y="128" width="290" height="44" rx="22" fill="#0d2619" stroke="#76b900"/>
  <text x="965" y="146" fill="#76b900" font-size="9" font-weight="700" text-anchor="middle">外层管理者</text>
  <text x="965" y="163" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">统一管理整套 NVIDIA GPU 软件</text>

  <!-- Five managed component cards; containment conveys management, no spaghetti lines -->
  <rect x="80" y="202" width="145" height="18" rx="9" fill="#16320e" stroke="#315c20"/>
  <text x="152" y="214" fill="#a3e635" font-size="8" font-weight="700" text-anchor="middle">被统一管理的组件</text>
  <rect x="80" y="225" width="170" height="180" rx="13" fill="#0f172a" stroke="#fbbf24" stroke-width="1.7"/>
  <rect x="98" y="244" width="66" height="24" rx="12" fill="#2b210d"/>
  <text x="131" y="260" fill="#fbbf24" class="tag" text-anchor="middle">DRIVER</text>
  <circle cx="115" cy="305" r="10" fill="#fbbf24"/>
  <text x="138" y="301" class="card-title">NVIDIA Driver</text>
  <text x="105" y="337" class="card-main">让 Linux 识别 GPU</text>
  <text x="105" y="365" class="card-sub">加载内核驱动</text>
  <text x="105" y="383" class="card-sub">也可以使用预装驱动</text>

  <rect x="270" y="225" width="170" height="180" rx="13" fill="#0f172a" stroke="#34d399" stroke-width="1.7"/>
  <rect x="288" y="244" width="70" height="24" rx="12" fill="#092c24"/>
  <text x="323" y="260" fill="#34d399" class="tag" text-anchor="middle">TOOLKIT</text>
  <circle cx="305" cy="305" r="10" fill="#34d399"/>
  <text x="328" y="301" class="card-title">Container Toolkit</text>
  <text x="295" y="337" class="card-main">让容器使用 GPU</text>
  <text x="295" y="365" class="card-sub">连接 containerd</text>
  <text x="295" y="383" class="card-sub">把 GPU 注入容器</text>

  <!-- Device Plugin is larger and visually dominant -->
  <rect x="460" y="215" width="280" height="200" rx="16" fill="#061723" stroke="#22d3ee" stroke-width="3"/>
  <rect x="482" y="236" width="100" height="26" rx="13" fill="#06303d" stroke="#0e7490"/>
  <text x="532" y="253" fill="#22d3ee" class="tag" text-anchor="middle">本文重点</text>
  <circle cx="498" cy="307" r="12" fill="#22d3ee"/>
  <text x="525" y="303" fill="#f8fafc" font-size="15" font-weight="700">Device Plugin</text>
  <text x="490" y="342" fill="#f8fafc" font-size="11" font-weight="700">让 Kubernetes 看见 GPU</text>
  <text x="490" y="366" fill="#f8fafc" font-size="11" font-weight="700">并把 GPU 分配给 Pod</text>
  <rect x="490" y="382" width="220" height="22" rx="11" fill="#083344"/>
  <text x="600" y="397" fill="#22d3ee" font-size="8.5" font-weight="700" text-anchor="middle">注册资源：nvidia.com/gpu</text>

  <rect x="760" y="225" width="170" height="180" rx="13" fill="#0f172a" stroke="#a78bfa" stroke-width="1.7"/>
  <rect x="778" y="244" width="72" height="24" rx="12" fill="#241747"/>
  <text x="814" y="260" fill="#a78bfa" class="tag" text-anchor="middle">LABELS</text>
  <circle cx="795" cy="305" r="10" fill="#a78bfa"/>
  <text x="818" y="301" class="card-title">NFD / GFD</text>
  <text x="785" y="337" class="card-main">给 GPU 节点贴标签</text>
  <text x="785" y="365" class="card-sub">GPU 型号、显存</text>
  <text x="785" y="383" class="card-sub">驱动和 CUDA 版本</text>

  <rect x="950" y="225" width="170" height="180" rx="13" fill="#0f172a" stroke="#fb7185" stroke-width="1.7"/>
  <rect x="968" y="244" width="76" height="24" rx="12" fill="#351322"/>
  <text x="1006" y="260" fill="#fb7185" class="tag" text-anchor="middle">HEALTH</text>
  <circle cx="985" cy="305" r="10" fill="#fb7185"/>
  <text x="1008" y="295" class="card-title">DCGM /</text>
  <text x="1008" y="315" fill="#f8fafc" font-size="10" font-weight="700">Operator Validator</text>
  <text x="975" y="347" class="card-main">监控并检查 GPU</text>
  <text x="975" y="372" class="card-sub">导出健康与性能指标</text>
  <text x="975" y="390" class="card-sub">校验 CUDA 链路</text>

  <!-- Two short takeaways leave a clean center corridor for the vertical connector -->
  <rect x="100" y="450" width="365" height="46" rx="23" fill="#111827" stroke="#334155"/>
  <text x="282" y="469" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">外层：GPU Operator 统一维护组件</text>
  <text x="282" y="486" fill="#94a3b8" font-size="8" text-anchor="middle">安装 · 配置 · 升级 · 健康检查</text>

  <rect x="735" y="450" width="365" height="46" rx="23" fill="#111827" stroke="#334155"/>
  <text x="917" y="469" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">其中之一：Device Plugin 负责设备资源</text>
  <text x="917" y="486" fill="#94a3b8" font-size="8" text-anchor="middle">发现 · 上报 · 分配</text>

  <!-- Only one vertical connector: Device Plugin registers the Kubernetes resource -->
  <line x1="600" y1="415" x2="600" y2="590" stroke="#22d3ee" stroke-width="2.5"
        marker-end="url(#cyanArrow)"/>
  <rect x="615" y="542" width="112" height="24" rx="12" fill="#062935" stroke="#0e7490"/>
  <text x="671" y="558" fill="#22d3ee" class="tag" text-anchor="middle">注册到 kubelet</text>

  <!-- What the user finally sees: a simple left-to-right request flow -->
  <line x1="350" y1="640" x2="470" y2="640" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="640" x2="850" y2="640" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="410" y="626" fill="#94a3b8" font-size="8" text-anchor="middle">申请 1 块 GPU</text>
  <text x="790" y="626" fill="#94a3b8" font-size="8" text-anchor="middle">分配真实设备</text>

  <rect x="100" y="590" width="250" height="100" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="1.7"/>
  <rect x="120" y="610" width="48" height="28" rx="7" fill="#083344" stroke="#0e7490"/>
  <text x="144" y="629" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle">POD</text>
  <text x="188" y="627" class="card-title">GPU 工作负载</text>
  <text x="125" y="660" class="card-sub">limits: nvidia.com/gpu: 1</text>
  <text x="125" y="678" class="tiny">Pod 不需要知道 GPU 在哪台机器</text>

  <rect x="470" y="590" width="260" height="100" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
  <rect x="490" y="610" width="48" height="28" rx="7" fill="#1d4ed8"/>
  <text x="514" y="629" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">K8s</text>
  <text x="558" y="627" class="card-title">可调度 GPU 资源</text>
  <text x="600" y="660" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">nvidia.com/gpu</text>
  <text x="600" y="679" fill="#67e8f9" font-size="7.5" text-anchor="middle">Scheduler 按数量进行调度</text>

  <rect x="850" y="590" width="250" height="100" rx="14" fill="#062e25" stroke="#34d399" stroke-width="1.8"/>
  <rect x="870" y="610" width="48" height="28" rx="7" fill="#76b900"/>
  <text x="894" y="629" fill="#07101f" font-size="9" font-weight="700" text-anchor="middle">GPU</text>
  <text x="938" y="627" class="card-title">NVIDIA GPU</text>
  <text x="875" y="660" class="card-sub">Device Plugin 完成设备分配</text>
  <text x="875" y="678" class="tiny">容器最终获得一块真实 GPU</text>

  <!-- Footer takeaway -->
  <rect x="275" y="714" width="650" height="25" rx="12" fill="#0b1425"/>
  <text x="600" y="731" fill="#cbd5e1" font-size="8.5" font-weight="700" text-anchor="middle">记住：GPU Operator 管全家桶；Device Plugin 专门让 Kubernetes 看见并分配 GPU</text>
</svg>
