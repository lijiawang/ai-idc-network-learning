<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #0f172a; }
    .panel-title { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .node { font-size: 21px; font-weight: 600; fill: #0f172a; }
    .note { font-size: 18px; font-weight: 600; }
    .small { font-size: 16px; fill: #475569; }
  </style>
  <defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#0891b2"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ea580c"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" class="title">GDS 的三种数据路径</text>
  <text x="600" y="94" text-anchor="middle" class="small">cuFile 每次都参与管理，但内部 GPU buffer 不是必经之路</text>

  <g transform="translate(45,125)">
    <rect width="340" height="535" rx="18" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
    <path d="M18 0 H322 Q340 0 340 18 V66 H0 V18 Q0 0 18 0" fill="#083b66"/>
    <circle cx="48" cy="33" r="20" fill="#06b6d4"/><text x="48" y="41" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">1</text>
    <text x="190" y="42" text-anchor="middle" class="panel-title">能直达</text>
    <rect x="65" y="105" width="210" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="170" y="137" text-anchor="middle" class="node">存储 / 网卡</text><text x="170" y="163" text-anchor="middle" class="small">数据来源</text>
    <path d="M170 181 V330" stroke="#0891b2" stroke-width="8" fill="none" marker-end="url(#arrow-cyan)"/>
    <text x="190" y="260" class="small" fill="#0891b2">直接传输</text>
    <rect x="65" y="345" width="210" height="88" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="170" y="380" text-anchor="middle" class="node">应用 GPU buffer</text><text x="170" y="408" text-anchor="middle" class="small">应用真正使用的显存</text>
    <rect x="32" y="470" width="276" height="46" rx="12" fill="#ecfeff"/>
    <text x="170" y="500" text-anchor="middle" class="note" fill="#0e7490">不需要显存中转</text>
  </g>

  <g transform="translate(430,125)">
    <rect width="340" height="535" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <path d="M18 0 H322 Q340 0 340 18 V66 H0 V18 Q0 0 18 0" fill="#083b66"/>
    <circle cx="48" cy="33" r="20" fill="#3b82f6"/><text x="48" y="41" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
    <text x="198" y="42" text-anchor="middle" class="panel-title">需要显存中转</text>
    <rect x="65" y="91" width="210" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="170" y="132" text-anchor="middle" class="node">存储 / 网卡</text>
    <path d="M170 157 V218" stroke="#2563eb" stroke-width="7" fill="none" marker-end="url(#arrow-blue)"/>
    <rect x="50" y="232" width="240" height="80" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="170" y="265" text-anchor="middle" class="node">cuFile 显存中转站</text><text x="170" y="292" text-anchor="middle" class="small">先临时接住数据</text>
    <path d="M170 312 V368" stroke="#2563eb" stroke-width="7" fill="none" marker-end="url(#arrow-blue)"/>
    <rect x="65" y="382" width="210" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="170" y="414" text-anchor="middle" class="node">应用 GPU buffer</text><text x="170" y="441" text-anchor="middle" class="small">再交给应用</text>
    <rect x="32" y="480" width="276" height="46" rx="12" fill="#eff6ff"/>
    <text x="170" y="510" text-anchor="middle" class="note" fill="#1d4ed8">仍不经过 CPU 内存</text>
  </g>

  <g transform="translate(815,125)">
    <rect width="340" height="535" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <path d="M18 0 H322 Q340 0 340 18 V66 H0 V18 Q0 0 18 0" fill="#083b66"/>
    <circle cx="48" cy="33" r="20" fill="#f97316"/><text x="48" y="41" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">3</text>
    <text x="195" y="42" text-anchor="middle" class="panel-title">CPU 兼容路径</text>
    <rect x="65" y="91" width="210" height="66" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="170" y="132" text-anchor="middle" class="node">存储</text>
    <path d="M170 157 V218" stroke="#ea580c" stroke-width="7" fill="none" marker-end="url(#arrow-orange)"/>
    <rect x="65" y="232" width="210" height="80" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="170" y="267" text-anchor="middle" class="node">CPU 内存</text><text x="170" y="294" text-anchor="middle" class="small">传统中转</text>
    <path d="M170 312 V368" stroke="#ea580c" stroke-width="7" fill="none" marker-end="url(#arrow-orange)"/>
    <rect x="65" y="382" width="210" height="78" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="170" y="414" text-anchor="middle" class="node">应用 GPU buffer</text><text x="170" y="441" text-anchor="middle" class="small">最后进入显存</text>
    <rect x="32" y="480" width="276" height="46" rx="12" fill="#fff7ed"/>
    <text x="170" y="510" text-anchor="middle" class="note" fill="#c2410c">性能收益会打折</text>
  </g>
</svg>
