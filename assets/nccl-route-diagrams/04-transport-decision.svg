<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#0b55d9"/>
</marker>
<marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#159438"/>
</marker>
<marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#dc2626"/>
</marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#f97316"/>
</marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#5f6680"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800.0" y="72" fill="#07143d" font-size="58" font-weight="800" text-anchor="middle">NCCL 到底走哪种传输方式？</text>
<rect x="520" y="135" width="560" height="70" rx="14" ry="14" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="800.0" y="179.0" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">两张 GPU 在同一台机器？</text>
<line x1="800" y1="205" x2="800" y2="250" stroke="#0b55d9" stroke-width="4" stroke-linecap="round"/>
<path d="M 800 250 L 520 250 L 520 300" fill="none" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 800 250 L 1135 250 L 1135 300" fill="none" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<circle cx="485" cy="250" r="26" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="485" y="259" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">是</text>
<circle cx="1115" cy="250" r="26" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="1115" y="259" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">否</text>
<rect x="360" y="300" width="360" height="68" rx="14" ry="14" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
<text x="540.0" y="343.0" fill="#f97316" font-size="28" font-weight="800" text-anchor="middle">是否支持 P2P？</text>
<path d="M 520 368 L 520 430 L 330 430 L 330 475" fill="none" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 520 368 L 520 430 L 765 430 L 765 475" fill="none" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<circle cx="335" cy="430" r="26" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="335" y="439" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">是</text>
<circle cx="765" cy="430" r="26" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="765" y="439" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">否</text>
<rect x="175" y="475" width="310" height="72" rx="14" ry="14" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="330.0" y="520.0" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">NVLink / PCIe P2P</text>
<rect x="610" y="475" width="310" height="72" rx="14" ry="14" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="765.0" y="520.0" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">SHM / CPU 中转</text>
<rect x="1010" y="300" width="250" height="72" rx="14" ry="14" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="1135.0" y="345.0" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">走 NET</text>
<rect x="955" y="455" width="360" height="72" rx="14" ry="14" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="1135.0" y="500.0" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">IB / RoCE / TCP</text>
<line x1="1135" y1="372" x2="1135" y2="455" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="935" y="605" width="400" height="68" rx="14" ry="14" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
<text x="1135.0" y="648.0" fill="#f97316" font-size="28" font-weight="800" text-anchor="middle">IB/RoCE 是否启用 GDRDMA？</text>
<line x1="1135" y1="527" x2="1135" y2="605" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M 1135 673 L 1135 720 L 915 720 L 915 750" fill="none" stroke="#159438" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M 1135 673 L 1135 720 L 1375 720 L 1375 750" fill="none" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<circle cx="945" cy="720" r="26" fill="#ffffff" stroke="#159438" stroke-width="3"/>
<text x="945" y="729" fill="#159438" font-size="24" font-weight="800" text-anchor="middle">是</text>
<circle cx="1325" cy="720" r="26" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
<text x="1325" y="729" fill="#f97316" font-size="24" font-weight="800" text-anchor="middle">否</text>
<rect x="720" y="750" width="390" height="78" rx="14" ry="14" fill="#f0fdf4" stroke="#159438" stroke-width="3"/>
<text x="915.0" y="798.0" fill="#159438" font-size="28" font-weight="800" text-anchor="middle">GPU ↔ NIC 直通</text>
<rect x="1180" y="750" width="390" height="78" rx="14" ry="14" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="1375.0" y="798.0" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">GPU ↔ CPU ↔ NIC</text>
<text x="1135" y="560" fill="#5f6680" font-size="22" font-weight="600" text-anchor="middle">GDRDMA 属于跨节点 NET 路径能力，不和 NET 平级</text>
<line x1="360" y1="846" x2="470" y2="846" stroke="#5f6680" stroke-width="2" stroke-linecap="round"/>
<text x="800" y="854" fill="#5f6680" font-size="24" font-weight="600" text-anchor="middle">修正版：GDRDMA 放在 NET / IB / RoCE 分支下面。</text>
<line x1="1130" y1="846" x2="1240" y2="846" stroke="#5f6680" stroke-width="2" stroke-linecap="round"/>
</svg>