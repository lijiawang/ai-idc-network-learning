<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
<defs>
<marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4, 0 8" fill="#0b55d9"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4, 0 8" fill="#159438"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4, 0 8" fill="#f97316"/></marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4, 0 8" fill="#5f6680"/></marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="76" fill="#07143d" font-size="58" font-weight="850" text-anchor="middle">NCCL 先画出一张拓扑地图</text>
<text x="800" y="124" fill="#5f6680" font-size="28" font-weight="600" text-anchor="middle">GPU、NVLink/NVSwitch、PCIe、CPU/NUMA、NIC、网络都会变成图上的节点和边</text>
<rect x="90" y="165" width="1060" height="610" rx="24" ry="24" fill="#fff" stroke="#0b55d9" stroke-width="3"/>
<text x="620" y="210" fill="#0b55d9" font-size="30" font-weight="800" text-anchor="middle">单机内部拓扑</text>
