<rect x="1245" y="520" width="220" height="82" rx="14" ry="14" fill="#fff" stroke="#0b55d9" stroke-width="3"/>
<rect x="1265" y="540" width="42" height="42" rx="7" ry="7" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
