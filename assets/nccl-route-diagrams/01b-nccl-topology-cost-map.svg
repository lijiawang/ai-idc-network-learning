<line x1="850" y1="346" x2="890" y2="430" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="180" y="398" fill="#0b55d9" font-size="22" font-weight="700" text-anchor="middle">PCIe</text>
<text x="960" y="398" fill="#0b55d9" font-size="22" font-weight="700" text-anchor="middle">PCIe</text>
<rect x="490" y="570" width="220" height="82" rx="14" ry="14" fill="#fff" stroke="#0b55d9" stroke-width="3"/>
<rect x="510" y="590" width="42" height="42" rx="7" ry="7" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
