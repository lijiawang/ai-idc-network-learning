<line x1="890" y1="502" x2="710" y2="570" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="835" y="574" width="150" height="74" rx="14" ry="14" fill="#fff" stroke="#f97316" stroke-width="3"/>
