<text x="880" y="314" fill="#07143d" font-size="28" font-weight="800" text-anchor="middle">GPU1</text>
<line x1="455" y1="303" x2="745" y2="303" stroke="#159438" stroke-width="8" stroke-linecap="round"/>
<line x1="745" y1="303" x2="455" y2="303" stroke="#159438" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<text x="600" y="284" fill="#159438" font-size="25" font-weight="800" text-anchor="middle">NVLink / NVSwitch</text>
