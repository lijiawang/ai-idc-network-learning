<rect x="263" y="278" width="48" height="48" rx="8" ry="8" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
<circle cx="287" cy="302" r="14" fill="#fff" stroke="#0b55d9" stroke-width="3"/>
