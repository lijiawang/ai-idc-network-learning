<text x="958" y="734" fill="#f97316" font-size="22" font-weight="800" text-anchor="middle">跨节点网络：另算成本</text>
<rect x="245" y="812" width="1110" height="58" rx="14" ry="14" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
<line x1="300" y1="841" x2="385" y2="841" stroke="#159438" stroke-width="5" stroke-linecap="round"/>
<text x="475" y="849" fill="#5f6680" font-size="21" font-weight="600" text-anchor="middle">GPU 高速互联</text>
<line x1="600" y1="841" x2="685" y2="841" stroke="#0b55d9" stroke-width="5" stroke-linecap="round"/>
<text x="775" y="849" fill="#5f6680" font-size="21" font-weight="600" text-anchor="middle">本机 PCIe/CPU 路径</text>
<line x1="930" y1="841" x2="1015" y2="841" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
<text x="1135" y="849" fill="#5f6680" font-size="21" font-weight="600" text-anchor="middle">NIC / 网络 / 跨节点路径</text>
