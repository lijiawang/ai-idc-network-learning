<line x1="1300" y1="466" x2="1355" y2="520" stroke="#f97316" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="195" y="700" width="245" height="50" rx="18" ry="18" fill="#f0fdf4" stroke="#159438" stroke-width="2"/>
<text x="318" y="734" fill="#159438" font-size="22" font-weight="800" text-anchor="middle">高速直连：低成本</text>
