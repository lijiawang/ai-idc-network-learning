<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#0b55d9"/>
</marker>
<marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#159438"/>
</marker>
<marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#dc2626"/>
</marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#f97316"/>
</marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<polygon points="0 0, 12 4, 0 8" fill="#5f6680"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800.0" y="72" fill="#07143d" font-size="58" font-weight="800" text-anchor="middle">GPU 之间的路，并不是一样近</text>
<text x="145" y="210" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">GPU 层</text>
<text x="145" y="330" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">PCIe 交换层</text>
<text x="145" y="462" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">CPU 层</text>
<text x="145" y="570" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">互连层</text>
<text x="145" y="690" fill="#0b55d9" font-size="24" font-weight="800" text-anchor="middle">GPU 层</text>
<line x1="70" y1="270" x2="1110" y2="270" stroke="#8bb6ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 10"/>
<line x1="70" y1="390" x2="1110" y2="390" stroke="#8bb6ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 10"/>
<line x1="70" y1="525" x2="1110" y2="525" stroke="#8bb6ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 10"/>
<line x1="70" y1="615" x2="1110" y2="615" stroke="#8bb6ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 10"/>
<rect x="250" y="140" width="850" height="640" rx="18" ry="18" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<rect x="310" y="175" width="180" height="76" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<rect x="326" y="193" width="44" height="40" rx="6" ry="6" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
<circle cx="348" cy="213" r="13" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="428.8" y="223" fill="#07143d" font-size="24" font-weight="800" text-anchor="middle">GPU0</text>
<rect x="760" y="175" width="180" height="76" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<rect x="776" y="193" width="44" height="40" rx="6" ry="6" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
<circle cx="798" cy="213" r="13" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="878.8" y="223" fill="#07143d" font-size="24" font-weight="800" text-anchor="middle">GPU1</text>
<line x1="490" y1="213" x2="760" y2="213" stroke="#159438" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<line x1="760" y1="213" x2="490" y2="213" stroke="#159438" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<text x="625" y="195" fill="#159438" font-size="24" font-weight="800" text-anchor="middle">NVLink</text>
<rect x="520" y="305" width="220" height="72" rx="10" ry="10" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="630.0" y="349.0" fill="#0b55d9" font-size="22" font-weight="800" text-anchor="middle">PCIe Switch A</text>
<line x1="400" y1="251" x2="590" y2="305" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="850" y1="251" x2="670" y2="305" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="540" y="430" width="180" height="70" rx="10" ry="10" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="630.0" y="473.0" fill="#0b55d9" font-size="22" font-weight="800" text-anchor="middle">CPU0</text>
<line x1="630" y1="377" x2="630" y2="430" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="540" y="545" width="180" height="64" rx="10" ry="10" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="630.0" y="585.0" fill="#0b55d9" font-size="22" font-weight="800" text-anchor="middle">UPI</text>
<line x1="630" y1="500" x2="630" y2="545" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="540" y="640" width="180" height="66" rx="10" ry="10" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="630.0" y="681.0" fill="#0b55d9" font-size="22" font-weight="800" text-anchor="middle">CPU1</text>
<line x1="630" y1="609" x2="630" y2="640" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="450" y="715" width="200" height="54" rx="10" ry="10" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="550.0" y="750.0" fill="#0b55d9" font-size="22" font-weight="800" text-anchor="middle">PCIe Switch B</text>
<rect x="700" y="715" width="200" height="54" rx="10" ry="10" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="800.0" y="750.0" fill="#0b55d9" font-size="22" font-weight="800" text-anchor="middle">PCIe Switch C</text>
<line x1="585" y1="706" x2="548" y2="715" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="675" y1="706" x2="802" y2="715" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="280" y="708" width="145" height="62" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<rect x="296" y="726" width="44" height="40" rx="6" ry="6" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
<circle cx="318" cy="746" r="13" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="375.7" y="756" fill="#07143d" font-size="24" font-weight="800" text-anchor="middle">GPU2</text>
<rect x="925" y="708" width="145" height="62" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<rect x="941" y="726" width="44" height="40" rx="6" ry="6" fill="#eff6ff" stroke="#0b55d9" stroke-width="3"/>
<circle cx="963" cy="746" r="13" fill="#ffffff" stroke="#0b55d9" stroke-width="3"/>
<text x="1020.7" y="756" fill="#07143d" font-size="24" font-weight="800" text-anchor="middle">GPU3</text>
<line x1="425" y1="739" x2="450" y2="739" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="900" y1="739" x2="925" y2="739" stroke="#0b55d9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="1170" y="188" fill="#159438" font-size="28" font-weight="800" text-anchor="middle">近</text>
<line x1="1170" y1="210" x2="1170" y2="770" stroke="#159438" stroke-width="5" stroke-linecap="round"/>
<line x1="1170" y1="770" x2="1170" y2="800" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="1170" y="825" fill="#dc2626" font-size="28" font-weight="800" text-anchor="middle">远</text>
<text x="1340" y="230" fill="#07143d" font-size="30" font-weight="800" text-anchor="middle">从快到慢</text>
<rect x="1220" y="285" width="330" height="64" rx="12" ry="12" fill="#f0fdf4" stroke="#159438" stroke-width="2"/>
<circle cx="1255" cy="317" r="20" fill="#159438"/>
<text x="1255" y="325" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle">1</text>
<text x="1295" y="325" fill="#159438" font-size="20" font-weight="800" text-anchor="start">NVL：NVLink / NVSwitch，最快</text>
<rect x="1220" y="380" width="330" height="64" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="2"/>
<circle cx="1255" cy="412" r="20" fill="#0b55d9"/>
<text x="1255" y="420" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle">2</text>
<text x="1295" y="420" fill="#0b55d9" font-size="20" font-weight="800" text-anchor="start">PIX：同一个 PCIe Switch</text>
<rect x="1220" y="475" width="330" height="64" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="2"/>
<circle cx="1255" cy="507" r="20" fill="#0b55d9"/>
<text x="1255" y="515" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle">3</text>
<text x="1295" y="515" fill="#0b55d9" font-size="20" font-weight="800" text-anchor="start">PXB：跨 PCIe Switch</text>
<rect x="1220" y="570" width="330" height="64" rx="12" ry="12" fill="#ffffff" stroke="#0b55d9" stroke-width="2"/>
<circle cx="1255" cy="602" r="20" fill="#0b55d9"/>
<text x="1255" y="610" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle">4</text>
<text x="1295" y="610" fill="#0b55d9" font-size="20" font-weight="800" text-anchor="start">PHB：经过 CPU Root Complex</text>
<rect x="1220" y="665" width="330" height="64" rx="12" ry="12" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
<circle cx="1255" cy="697" r="20" fill="#dc2626"/>
<text x="1255" y="705" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle">5</text>
<text x="1295" y="705" fill="#dc2626" font-size="20" font-weight="800" text-anchor="start">SYS：跨 NUMA，最远</text>
<line x1="360" y1="846" x2="470" y2="846" stroke="#5f6680" stroke-width="2" stroke-linecap="round"/>
<text x="800" y="854" fill="#5f6680" font-size="24" font-weight="600" text-anchor="middle">这张解释 NVL/PIX/PXB/PHB/SYS，重点是 GPU-GPU 路径距离。</text>
<line x1="1130" y1="846" x2="1240" y2="846" stroke="#5f6680" stroke-width="2" stroke-linecap="round"/>
</svg>