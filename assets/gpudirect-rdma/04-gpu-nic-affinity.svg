<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <linearGradient id="rdma-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="cover-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07132d"/>
      <stop offset="56%" stop-color="#102a5c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="42" y="42" font-size="24" fill="#111827" text-anchor="start" font-weight="700">GDRDMA 快不快，关键看 GPU-NIC 亲缘关系</text>
  <text x="42" y="72" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">跨节点训练不是随便找一张网卡就发，GPU 到 NIC 的 PCIe/NUMA 路径会直接影响性能。</text>
  <rect x="50" y="112" width="530" height="455" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="80" y="148" font-size="18" fill="#111827" text-anchor="start" font-weight="700">近：同 PCIe Switch / 同 NUMA</text>
  <rect x="252" y="196" width="126" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="315" y="227" font-size="17" fill="#111827" text-anchor="middle" font-weight="700">CPU0</text>
  <text x="315" y="249" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">控制 / 调度</text>
  <rect x="230" y="306" width="170" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="315" y="339" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">PCIe Switch A</text>
  <rect x="112" y="420" width="126" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="175" y="448" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">GPU0</text>
  <rect x="130" y="467" width="90" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="175" y="480" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">HBM</text>
  <text x="175" y="498" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">显存</text>
  <rect x="380" y="428" width="128" height="72" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="444" y="458" font-size="17" fill="#16a34a" text-anchor="middle" font-weight="700">NIC0</text>
  <text x="444" y="480" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">RDMA 网卡</text>
  <path d="M 238 464 L 376 464" stroke="#16a34a" stroke-width="3.4" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="262" y="424" width="93" height="23" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="308" y="440" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="600">近端 GDRDMA</text>
  <line x1="315" y1="266" x2="315" y2="304" stroke="#6b7280" stroke-width="1.7"/>
  <line x1="238" y1="420" x2="315" y2="360" stroke="#6b7280" stroke-width="1.7"/>
  <line x1="444" y1="428" x2="315" y2="360" stroke="#6b7280" stroke-width="1.7"/>
  <text x="315" y="536" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">路径短、可预测性更好</text>
  <text x="315" y="554" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">多 rail 机器通常希望 GPU i 找 NIC i</text>
  <rect x="620" y="112" width="530" height="455" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="650" y="148" font-size="18" fill="#111827" text-anchor="start" font-weight="700">远：跨 Socket / 跨 NUMA</text>
  <rect x="676" y="205" width="126" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="739" y="236" font-size="17" fill="#111827" text-anchor="middle" font-weight="700">CPU0</text>
  <text x="739" y="258" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">控制 / 调度</text>
  <rect x="966" y="205" width="126" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1029" y="236" font-size="17" fill="#111827" text-anchor="middle" font-weight="700">CPU1</text>
  <text x="1029" y="258" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">控制 / 调度</text>
  <rect x="655" y="316" width="170" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="740" y="349" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">PCIe Switch A</text>
  <rect x="945" y="316" width="170" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1030" y="349" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">PCIe Switch B</text>
  <rect x="650" y="430" width="126" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="713" y="458" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">GPU0</text>
  <rect x="668" y="477" width="90" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="713" y="490" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">HBM</text>
  <text x="713" y="508" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">显存</text>
  <rect x="990" y="438" width="128" height="72" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="1054" y="468" font-size="17" fill="#16a34a" text-anchor="middle" font-weight="700">NIC7</text>
  <text x="1054" y="490" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">RDMA 网卡</text>
  <path d="M 776 474 L 986 474" stroke="#dc2626" stroke-width="2.6" fill="none" marker-end="url(#arrow-red)" stroke-dasharray="6,5"/>
  <rect x="849" y="434" width="70" height="23" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="884" y="450" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="600">远端路径</text>
  <line x1="802" y1="241" x2="962" y2="241" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="882" y="231" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">UPI / IF</text>
  <line x1="739" y1="275" x2="739" y2="316" stroke="#6b7280" stroke-width="1.7"/>
  <line x1="1029" y1="275" x2="1029" y2="316" stroke="#6b7280" stroke-width="1.7"/>
  <line x1="713" y1="430" x2="740" y2="370" stroke="#6b7280" stroke-width="1.7"/>
  <line x1="1054" y1="438" x2="1030" y2="370" stroke="#6b7280" stroke-width="1.7"/>
  <text x="885" y="536" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">可能可用，但延迟更高、带宽更差</text>
  <text x="885" y="554" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">不建议靠强制放开 SYS 来赌性能</text>
  <text x="600" y="635" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">实战先看 nvidia-smi topo -m：GPU-NIC 之间的 PIX/PXB/PHB/SYS 距离，比“网卡插了几张”更重要。</text>
</svg>