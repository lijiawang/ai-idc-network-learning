<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <linearGradient id="rdma-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="cover-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07132d"/>
      <stop offset="56%" stop-color="#102a5c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="42" y="42" font-size="24" fill="#111827" text-anchor="start" font-weight="700">NCCL 在哪里判断要不要用 GPUDirect RDMA</text>
  <text x="42" y="72" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">跨节点时 NCCL 进入 NET 路径，再结合网卡、拓扑和环境变量判断能否启用 GDRDMA。</text>
  <rect x="70" y="130" width="230" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="185" y="166" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">Collective 调用</text>
  <text x="185" y="193" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">AllReduce / AllGather ...</text>
  <rect x="400" y="130" width="230" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="515" y="166" font-size="17" fill="#111827" text-anchor="middle" font-weight="700">NCCL 拓扑图</text>
  <text x="515" y="193" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">GPU / NIC / PCIe / NUMA</text>
  <rect x="750" y="130" width="230" height="92" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="865" y="166" font-size="17" fill="#16a34a" text-anchor="middle" font-weight="700">选择传输</text>
  <text x="865" y="193" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">P2P / SHM / NET</text>
  <path d="M 300 176 L 396 176" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 630 176 L 746 176" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="190" y="310" width="820" height="86" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="600" y="343" font-size="18" fill="#0891b2" text-anchor="middle" font-weight="700">跨节点：进入 NET / IB / RoCE 路径</text>
  <text x="600" y="370" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">如果 GPU buffer + RDMA NIC + 拓扑距离都合适，就尝试走 GDRDMA</text>
  <path d="M 865 222 L 865 268 C 865 302 810 319 1010 353" stroke="#0891b2" stroke-width="2.5" fill="none" marker-end="url(#arrow-cyan)"/>
  <rect x="120" y="485" width="210" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="225" y="520" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">GPU buffer</text>
  <text x="225" y="547" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">通信对象真的是 CUDA device memory</text>
  <rect x="370" y="485" width="210" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="475" y="520" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">NIC 支持</text>
  <text x="475" y="547" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">IB/RoCE HCA 与驱动可用</text>
  <rect x="620" y="485" width="210" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="725" y="520" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">拓扑合适</text>
  <text x="725" y="547" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">GPU-NIC 距离没有太远</text>
  <rect x="870" y="485" width="210" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="975" y="520" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">策略允许</text>
  <text x="975" y="547" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">NCCL_NET_GDR_LEVEL 没限制住</text>
  <path d="M 330 530 L 366 530" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 580 530 L 616 530" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 830 530 L 866 530" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="385" y="610" width="430" height="52" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="600" y="643" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">任一条件不满足，就可能退回 Host staging 或其他 NET 路径</text>
</svg>