<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <linearGradient id="rdma-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="cover-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07132d"/>
      <stop offset="56%" stop-color="#102a5c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="42" y="42" font-size="24" fill="#111827" text-anchor="start" font-weight="700">排查 GPUDirect RDMA，按这张表从近到远看</text>
  <text x="42" y="72" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">先确认本机 GPU-NIC 数据路径，再看 NCCL，再看网络 fabric。</text>
  <rect x="90" y="130" width="470" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="108" y="150" width="42" height="42" rx="21" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="129" y="178" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">1</text>
  <text x="172" y="166" font-size="16" fill="#111827" text-anchor="start" font-weight="700">1. GPU-NIC 拓扑</text>
  <text x="172" y="192" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">nvidia-smi topo -m</text>
  <text x="172" y="210" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">优先确认 PIX / PXB / PHB / SYS</text>
  <rect x="90" y="250" width="470" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="108" y="270" width="42" height="42" rx="21" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="129" y="298" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="700">2</text>
  <text x="172" y="286" font-size="16" fill="#111827" text-anchor="start" font-weight="700">2. 驱动模块</text>
  <text x="172" y="312" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">nvidia-peermem 是否加载</text>
  <text x="172" y="330" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">CUDA / driver / OFED 版本兼容</text>
  <rect x="90" y="370" width="470" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="108" y="390" width="42" height="42" rx="21" fill="#f8fafc" stroke="#0891b2" stroke-width="2"/>
  <text x="129" y="418" font-size="18" fill="#0891b2" text-anchor="middle" font-weight="700">3</text>
  <text x="172" y="406" font-size="16" fill="#111827" text-anchor="start" font-weight="700">3. 显存映射资源</text>
  <text x="172" y="432" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">BAR1 空间是否异常</text>
  <text x="172" y="450" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">IOMMU 是否影响 peer DMA</text>
  <rect x="640" y="130" width="470" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="658" y="150" width="42" height="42" rx="21" fill="#f8fafc" stroke="#9333ea" stroke-width="2"/>
  <text x="679" y="178" font-size="18" fill="#9333ea" text-anchor="middle" font-weight="700">4</text>
  <text x="722" y="166" font-size="16" fill="#111827" text-anchor="start" font-weight="700">4. NCCL 日志</text>
  <text x="722" y="192" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">NCCL_DEBUG=INFO</text>
  <text x="722" y="210" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">NCCL_DEBUG_SUBSYS=INIT,GRAPH,NET</text>
  <rect x="640" y="250" width="470" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="658" y="270" width="42" height="42" rx="21" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
  <text x="679" y="298" font-size="18" fill="#ea580c" text-anchor="middle" font-weight="700">5</text>
  <text x="722" y="286" font-size="16" fill="#111827" text-anchor="start" font-weight="700">5. 网卡选择</text>
  <text x="722" y="312" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">NCCL_IB_HCA / SOCKET_IFNAME</text>
  <text x="722" y="330" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">多 rail 是否按预期使用</text>
  <rect x="640" y="370" width="470" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="658" y="390" width="42" height="42" rx="21" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <text x="679" y="418" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">6</text>
  <text x="722" y="406" font-size="16" fill="#111827" text-anchor="start" font-weight="700">6. 网络 fabric</text>
  <text x="722" y="432" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">IB/RoCE 链路、PFC/ECN</text>
  <text x="722" y="450" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">拥塞、丢包、路由、oversubscription</text>
  <path d="M 325 220 L 325 246" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 325 340 L 325 366" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 560 415 C 595 415 610 180 636 176" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
  <path d="M 875 220 L 875 246" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 875 340 L 875 366" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="260" y="555" width="680" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="584" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">经验法则</text>
  <text x="600" y="609" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">先证明“本机 GPU 到 NIC 没绕路”，再讨论交换机、拥塞和训练框架。</text>
</svg>