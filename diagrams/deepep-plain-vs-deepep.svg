<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.section { font-size: 17px; font-weight: 700; }
.label { font-size: 15px; font-weight: 650; }
.body { font-size: 14px; fill: #374151; }
.small { font-size: 12px; fill: #6b7280; }
.tiny { font-size: 11px; fill: #6b7280; }
.mono { font-size: 13px; fill: #374151; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/></marker>
<marker id="arrow-gray-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#6b7280"/></marker>
<marker id="arrow-green-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="760" rx="0" ry="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="18" y="18" width="1244" height="724" rx="18" ry="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="640.0" y="56" class="title" text-anchor="middle">普通方案 vs DeepEP：差别在整条链路怎么组织</text>
<text x="640.0" y="86" class="subtitle" text-anchor="middle">DeepEP 不是比 router 更懂目的地，而是把 dispatch / combine 周边动作做成专用路径</text>
<rect x="62" y="126" width="1156" height="252" rx="16" ry="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<rect x="62" y="424" width="1156" height="230" rx="16" ry="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="96" y="162" class="section" text-anchor="start" fill="#ea580c">普通 MoE All-to-All</text>
<text x="96" y="460" class="section" text-anchor="start" fill="#16a34a">DeepEP 思路</text>
<rect x="112" y="206" width="128" height="82" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
<text x="176" y="238" class="label" text-anchor="middle">router</text>
<text x="176" y="262" class="small" text-anchor="middle">目的地表</text>
<line x1="240" y1="247" x2="268" y2="247" stroke="#ea580c" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="282" y="206" width="128" height="82" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
<text x="346" y="238" class="label" text-anchor="middle">分桶/拷贝</text>
<text x="346" y="262" class="small" text-anchor="middle">send buffer</text>
<line x1="410" y1="247" x2="438" y2="247" stroke="#ea580c" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="452" y="206" width="128" height="82" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
<text x="516" y="238" class="label" text-anchor="middle">通用通信</text>
<text x="516" y="262" class="small" text-anchor="middle">All-to-All</text>
<line x1="580" y1="247" x2="608" y2="247" stroke="#ea580c" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="622" y="206" width="128" height="82" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
<text x="686" y="238" class="label" text-anchor="middle">接收整理</text>
<text x="686" y="262" class="small" text-anchor="middle">expert 布局</text>
<line x1="750" y1="247" x2="778" y2="247" stroke="#ea580c" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="792" y="206" width="128" height="82" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
<text x="856" y="238" class="label" text-anchor="middle">expert</text>
<text x="856" y="262" class="small" text-anchor="middle">矩阵计算</text>
<line x1="920" y1="247" x2="948" y2="247" stroke="#ea580c" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="962" y="206" width="128" height="82" rx="10" ry="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
<text x="1026" y="238" class="label" text-anchor="middle">回传/恢复</text>
<text x="1026" y="262" class="small" text-anchor="middle">combine</text>
<text x="640" y="330" class="small" text-anchor="middle" fill="#9a3412">容易把时间花在：多次搬运、临时重排、等待同步、通信和计算互相抢资源</text>
<rect x="112" y="502" width="132" height="84" rx="10" ry="10" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
<text x="178.0" y="535" class="label" text-anchor="middle" fill="#16a34a">router</text>
<text x="178.0" y="560" class="small" text-anchor="middle">目的地表</text>
<line x1="244" y1="544" x2="296" y2="544" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="312" y="502" width="260" height="84" rx="10" ry="10" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
<text x="442.0" y="535" class="label" text-anchor="middle" fill="#16a34a">DeepEP dispatch</text>
<text x="442.0" y="560" class="small" text-anchor="middle">分桶 + 打包 + 传输 + 接收布局</text>
<line x1="572" y1="544" x2="626" y2="544" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="642" y="502" width="190" height="84" rx="10" ry="10" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
<text x="737.0" y="535" class="label" text-anchor="middle" fill="#16a34a">expert 计算</text>
<text x="737.0" y="560" class="small" text-anchor="middle">直接吃更合适的布局</text>
<line x1="832" y1="544" x2="874" y2="544" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="890" y="502" width="260" height="84" rx="10" ry="10" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
<text x="1020.0" y="535" class="label" text-anchor="middle" fill="#16a34a">DeepEP combine</text>
<text x="1020.0" y="560" class="small" text-anchor="middle">按 handle 回来并 top-k 合并</text>
<rect x="395" y="618" width="490" height="34" rx="9" ry="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
<text x="640" y="641" class="label" text-anchor="middle" fill="#15803d">少拷贝 · 少重排 · 少等待 · 少占 GPU SM</text>
</svg>