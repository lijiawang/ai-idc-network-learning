<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1820" viewBox="0 0 1600 1820">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#111827; }
    .title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#4b5563}.h{font-size:23px;font-weight:800}.sub{font-size:16px;fill:#4b5563}.small{font-size:13px;fill:#6b7280}.tiny{font-size:12px;fill:#64748b}.mono{font-family:Menlo,Monaco,Consolas,monospace;font-size:14px;font-weight:750}.monoSmall{font-family:Menlo,Monaco,Consolas,monospace;font-size:12.5px;font-weight:700}.bigmono{font-family:Menlo,Monaco,Consolas,monospace;font-size:20px;font-weight:850}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.cell{stroke:#fff;stroke-width:1.5}.gpuTitle{font-size:18px;font-weight:800}.stepCircle{fill:#2563eb}.stepText{fill:#fff;font-size:18px;font-weight:800}.blue{stroke:#2563eb;fill:none;stroke-width:3}.gray{stroke:#94a3b8;fill:none;stroke-width:2.2}.orange{stroke:#ea580c;fill:none;stroke-width:3}.green{stroke:#16a34a;fill:none;stroke-width:3}.purple{stroke:#9333ea;fill:none;stroke-width:3}.tag{font-size:15px;font-weight:800}.callout{font-size:16px;font-weight:750;fill:#374151}.roundHead{font-size:16px;font-weight:800}.edgeLabel{font-size:13px;font-weight:800}.done{font-size:13px;font-weight:800;fill:#166534}.gpuBox{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.gpuBoxHot{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="#2563eb"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="#94a3b8"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="#ea580c"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0,0 12,4 0,8" fill="#9333ea"/></marker>
  </defs>
  <rect width="1600" height="1820" fill="#ffffff"/>
  <text x="70" y="58" class="title">Ring ReduceScatter：错位并发地累加，再分片输出</text>
  <text x="70" y="92" class="subtitle">4 个 chunk 不会一个算完再算下一个；它们会同时在 Ring 上推进，每轮每张 GPU 都“发一个、收一个、加一个”。</text>
  <rect x="70" y="120" width="1460" height="78" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="100" y="152" class="callout">一句话记住：</text>
  <text x="214" y="152" class="sub">4 张 GPU 时，ReduceScatter 的 Reduce 阶段有 N−1=3 轮；每一轮 4 条 Ring 边同时传输。</text>
  <text x="214" y="180" class="small">每个格子里的“发送值”到达接收方后，接收方马上加上自己同编号 chunk；发送不是剪切，不会把源数据清零。</text>
  <circle cx="92" cy="250" r="22" class="stepCircle"/><text x="92" y="257" text-anchor="middle" class="stepText">1</text>
  <text x="126" y="258" class="h">输入：每张 GPU 都有完整张量 M，并切成 4 个 chunk</text>
  <rect x="70" y="286" width="1460" height="236" rx="16" class="panel"/>
  <text x="105" y="345" class="gpuTitle">GPU0</text>
  <rect x="190" y="318" width="360" height="35" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="190" y="318" width="90" height="35" fill="#dbeafe" class="cell"/>
  <text x="235" y="341" text-anchor="middle" class="mono">A0</text>
  <rect x="280" y="318" width="90" height="35" fill="#e9d5ff" class="cell"/>
  <text x="325" y="341" text-anchor="middle" class="mono">A1</text>
  <rect x="370" y="318" width="90" height="35" fill="#dcfce7" class="cell"/>
  <text x="415" y="341" text-anchor="middle" class="mono">A2</text>
  <rect x="460" y="318" width="90" height="35" fill="#fed7aa" class="cell"/>
  <text x="505" y="341" text-anchor="middle" class="mono">A3</text>
  <text x="105" y="390" class="gpuTitle">GPU1</text>
  <rect x="190" y="363" width="360" height="35" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="190" y="363" width="90" height="35" fill="#dbeafe" class="cell"/>
  <text x="235" y="386" text-anchor="middle" class="mono">B0</text>
  <rect x="280" y="363" width="90" height="35" fill="#e9d5ff" class="cell"/>
  <text x="325" y="386" text-anchor="middle" class="mono">B1</text>
  <rect x="370" y="363" width="90" height="35" fill="#dcfce7" class="cell"/>
  <text x="415" y="386" text-anchor="middle" class="mono">B2</text>
  <rect x="460" y="363" width="90" height="35" fill="#fed7aa" class="cell"/>
  <text x="505" y="386" text-anchor="middle" class="mono">B3</text>
  <text x="105" y="435" class="gpuTitle">GPU2</text>
  <rect x="190" y="408" width="360" height="35" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="190" y="408" width="90" height="35" fill="#dbeafe" class="cell"/>
  <text x="235" y="431" text-anchor="middle" class="mono">C0</text>
  <rect x="280" y="408" width="90" height="35" fill="#e9d5ff" class="cell"/>
  <text x="325" y="431" text-anchor="middle" class="mono">C1</text>
  <rect x="370" y="408" width="90" height="35" fill="#dcfce7" class="cell"/>
  <text x="415" y="431" text-anchor="middle" class="mono">C2</text>
  <rect x="460" y="408" width="90" height="35" fill="#fed7aa" class="cell"/>
  <text x="505" y="431" text-anchor="middle" class="mono">C3</text>
  <text x="105" y="480" class="gpuTitle">GPU3</text>
  <rect x="190" y="453" width="360" height="35" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="190" y="453" width="90" height="35" fill="#dbeafe" class="cell"/>
  <text x="235" y="476" text-anchor="middle" class="mono">D0</text>
  <rect x="280" y="453" width="90" height="35" fill="#e9d5ff" class="cell"/>
  <text x="325" y="476" text-anchor="middle" class="mono">D1</text>
  <rect x="370" y="453" width="90" height="35" fill="#dcfce7" class="cell"/>
  <text x="415" y="476" text-anchor="middle" class="mono">D2</text>
  <rect x="460" y="453" width="90" height="35" fill="#fed7aa" class="cell"/>
  <text x="505" y="476" text-anchor="middle" class="mono">D3</text>
  <rect x="650" y="330" width="175" height="44" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="737.5" y="357" text-anchor="middle" class="tag">chunk0 → 最终给 GPU0</text>
  <rect x="855" y="330" width="175" height="44" rx="10" fill="#e9d5ff" stroke="#cbd5e1"/>
  <text x="942.5" y="357" text-anchor="middle" class="tag">chunk1 → 最终给 GPU1</text>
  <rect x="1060" y="330" width="175" height="44" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
  <text x="1147.5" y="357" text-anchor="middle" class="tag">chunk2 → 最终给 GPU2</text>
  <rect x="1265" y="330" width="175" height="44" rx="10" fill="#fed7aa" stroke="#cbd5e1"/>
  <text x="1352.5" y="357" text-anchor="middle" class="tag">chunk3 → 最终给 GPU3</text>
  <text x="650" y="410" class="sub">同编号相加：A0/B0/C0/D0 → S0；A1/B1/C1/D1 → S1；A2/B2/C2/D2 → S2；A3/B3/C3/D3 → S3。</text>
  <text x="650" y="438" class="sub">下面先看一轮的并发，再看 3 轮完整流水。</text>
  <path d="M 800,532 C 800,560 800,575 800,604" class="gray" marker-end="url(#arrow-gray)"/>
  <circle cx="92" cy="638" r="22" class="stepCircle"/><text x="92" y="645" text-anchor="middle" class="stepText">2</text>
  <text x="126" y="646" class="h">先看一轮：同一时刻，4 张 GPU 都在发，不是只有 GPU0 在发</text>
  <rect x="70" y="674" width="1460" height="330" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="100" y="707" class="sub">第 1 轮同时发生的 4 条传输如下。箭头上的 chunk 名称是错位调度好的，不是随便选。</text>
  <rect x="250" y="775" width="170" height="58" rx="13" class="gpuBox"/>
  <text x="335" y="812" text-anchor="middle" class="h">GPU0</text>
  <rect x="690" y="775" width="170" height="58" rx="13" class="gpuBox"/>
  <text x="775" y="812" text-anchor="middle" class="h">GPU1</text>
  <rect x="690" y="895" width="170" height="58" rx="13" class="gpuBox"/>
  <text x="775" y="932" text-anchor="middle" class="h">GPU2</text>
  <rect x="250" y="895" width="170" height="58" rx="13" class="gpuBox"/>
  <text x="335" y="932" text-anchor="middle" class="h">GPU3</text>

  <path d="M 420,804 L 680,804" class="blue" marker-end="url(#arrow-blue)"/>
  <rect x="535" y="770" width="76" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="573" y="789" text-anchor="middle" class="mono">A3</text>

  <path d="M 775,833 L 775,885" class="purple" marker-end="url(#arrow-purple)"/>
  <rect x="800" y="852" width="76" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="838" y="871" text-anchor="middle" class="mono">B0</text>

  <path d="M 690,924 L 430,924" class="green" marker-end="url(#arrow-green)"/>
  <rect x="535" y="942" width="76" height="26" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="573" y="961" text-anchor="middle" class="mono">C1</text>

  <path d="M 335,895 L 335,843" class="orange" marker-end="url(#arrow-orange)"/>
  <rect x="250" y="852" width="76" height="26" rx="6" fill="#ffffff" stroke="#fed7aa"/>
  <text x="288" y="871" text-anchor="middle" class="mono">D2</text>

  <rect x="955" y="752" width="520" height="205" rx="12" fill="#ffffff" stroke="#fed7aa"/>
  <text x="982" y="785" class="roundHead">这一轮怎么读</text>
  <text x="982" y="817" class="small">1. GPU0 → GPU1：发 A3；GPU1 做 B3 += A3</text>
  <text x="982" y="845" class="small">2. GPU1 → GPU2：发 B0；GPU2 做 C0 += B0</text>
  <text x="982" y="873" class="small">3. GPU2 → GPU3：发 C1；GPU3 做 D1 += C1</text>
  <text x="982" y="901" class="small">4. GPU3 → GPU0：发 D2；GPU0 做 A2 += D2</text>
  <line x1="982" y1="925" x2="1448" y2="925" stroke="#fed7aa"/>
  <text x="982" y="949" class="small">这 4 条箭头是同一轮同时发生的；下一轮部分和继续向前走。</text>
  <path d="M 800,1016 C 800,1038 800,1048 800,1066" class="gray" marker-end="url(#arrow-gray)"/>
  <circle cx="92" cy="1080" r="22" class="stepCircle"/><text x="92" y="1087" text-anchor="middle" class="stepText">3</text>
  <text x="126" y="1088" class="h">完整 3 轮：每一列是一轮，同一列的 4 行同时发生</text>
  <rect x="70" y="1116" width="1460" height="470" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="100" y="1148" class="sub">每格上半行是“这条边发送什么”，下半行是“接收方收到后加什么”。</text>
  <rect x="100" y="1172" width="170" height="48" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="185.0" y="1202" text-anchor="middle" class="roundHead">Ring 边</text>
  <rect x="270" y="1172" width="400" height="48" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="470.0" y="1202" text-anchor="middle" class="roundHead">第 1 轮：同时发生</text>
  <rect x="670" y="1172" width="400" height="48" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="870.0" y="1202" text-anchor="middle" class="roundHead">第 2 轮：同时发生</text>
  <rect x="1070" y="1172" width="400" height="48" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1270.0" y="1202" text-anchor="middle" class="roundHead">第 3 轮：同时发生</text>
  <rect x="100" y="1220" width="170" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="118" y="1254" class="edgeLabel" fill="#2563eb">GPU0 → GPU1</text>
  <path d="M 124,1272 L 242,1272" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="270" y="1220" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="292" y="1248" class="mono" fill="#2563eb">发 A3</text>
  <text x="292" y="1274" class="monoSmall">GPU1: B3 += A3 → A3+B3</text>
  <rect x="670" y="1220" width="400" height="78" fill="#fffbeb" stroke="#e5e7eb"/>
  <text x="692" y="1248" class="mono" fill="#2563eb">发 D2+A2</text>
  <text x="692" y="1274" class="monoSmall">GPU1: B2 += D2+A2 → D2+A2+B2</text>
  <rect x="1070" y="1220" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1092" y="1248" class="mono" fill="#2563eb">发 C1+D1+A1</text>
  <text x="1092" y="1274" class="monoSmall">GPU1: B1 += ... → S1</text>
  <rect x="100" y="1298" width="170" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="118" y="1332" class="edgeLabel" fill="#9333ea">GPU1 → GPU2</text>
  <path d="M 124,1350 L 242,1350" stroke="#9333ea" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="270" y="1298" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="292" y="1326" class="mono" fill="#9333ea">发 B0</text>
  <text x="292" y="1352" class="monoSmall">GPU2: C0 += B0 → B0+C0</text>
  <rect x="670" y="1298" width="400" height="78" fill="#fffbeb" stroke="#e5e7eb"/>
  <text x="692" y="1326" class="mono" fill="#9333ea">发 A3+B3</text>
  <text x="692" y="1352" class="monoSmall">GPU2: C3 += A3+B3 → A3+B3+C3</text>
  <rect x="1070" y="1298" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1092" y="1326" class="mono" fill="#9333ea">发 D2+A2+B2</text>
  <text x="1092" y="1352" class="monoSmall">GPU2: C2 += ... → S2</text>
  <rect x="100" y="1376" width="170" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="118" y="1410" class="edgeLabel" fill="#16a34a">GPU2 → GPU3</text>
  <path d="M 124,1428 L 242,1428" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="270" y="1376" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="292" y="1404" class="mono" fill="#16a34a">发 C1</text>
  <text x="292" y="1430" class="monoSmall">GPU3: D1 += C1 → C1+D1</text>
  <rect x="670" y="1376" width="400" height="78" fill="#fffbeb" stroke="#e5e7eb"/>
  <text x="692" y="1404" class="mono" fill="#16a34a">发 B0+C0</text>
  <text x="692" y="1430" class="monoSmall">GPU3: D0 += B0+C0 → B0+C0+D0</text>
  <rect x="1070" y="1376" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1092" y="1404" class="mono" fill="#16a34a">发 A3+B3+C3</text>
  <text x="1092" y="1430" class="monoSmall">GPU3: D3 += ... → S3</text>
  <rect x="100" y="1454" width="170" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="118" y="1488" class="edgeLabel" fill="#ea580c">GPU3 → GPU0</text>
  <path d="M 124,1506 L 242,1506" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="270" y="1454" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="292" y="1482" class="mono" fill="#ea580c">发 D2</text>
  <text x="292" y="1508" class="monoSmall">GPU0: A2 += D2 → D2+A2</text>
  <rect x="670" y="1454" width="400" height="78" fill="#fffbeb" stroke="#e5e7eb"/>
  <text x="692" y="1482" class="mono" fill="#ea580c">发 C1+D1</text>
  <text x="692" y="1508" class="monoSmall">GPU0: A1 += C1+D1 → C1+D1+A1</text>
  <rect x="1070" y="1454" width="400" height="78" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1092" y="1482" class="mono" fill="#ea580c">发 B0+C0+D0</text>
  <text x="1092" y="1508" class="monoSmall">GPU0: A0 += ... → S0</text>
  <rect x="100" y="1535" width="1320" height="34" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="118" y="1557" class="small">错位结果：S0 最后在 GPU3→GPU0 完成；S1 在 GPU0→GPU1 完成；S2 在 GPU1→GPU2 完成；S3 在 GPU2→GPU3 完成。</text>
  <path d="M 800,1595 C 800,1620 800,1630 800,1655" class="gray" marker-end="url(#arrow-gray)"/>
  <circle cx="92" cy="1688" r="22" class="stepCircle"/><text x="92" y="1695" text-anchor="middle" class="stepText">4</text>
  <text x="126" y="1696" class="h">ReduceScatter 输出：每张 GPU 只得到自己编号的全局和</text>
  <rect x="70" y="1708" width="1460" height="72" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="110" y="1718" width="310" height="42" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="110" y="1718" width="84" height="42" rx="10" fill="#dbeafe" stroke="none"/>
  <text x="152" y="1745" text-anchor="middle" class="tag">GPU0</text>
  <text x="236" y="1746" text-anchor="middle" class="bigmono">S0</text>
  <text x="335" y="1745" text-anchor="middle" class="monoSmall">A0+B0+C0+D0</text>
  <rect x="470" y="1718" width="310" height="42" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="470" y="1718" width="84" height="42" rx="10" fill="#e9d5ff" stroke="none"/>
  <text x="512" y="1745" text-anchor="middle" class="tag">GPU1</text>
  <text x="596" y="1746" text-anchor="middle" class="bigmono">S1</text>
  <text x="695" y="1745" text-anchor="middle" class="monoSmall">A1+B1+C1+D1</text>
  <rect x="830" y="1718" width="310" height="42" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="830" y="1718" width="84" height="42" rx="10" fill="#dcfce7" stroke="none"/>
  <text x="872" y="1745" text-anchor="middle" class="tag">GPU2</text>
  <text x="956" y="1746" text-anchor="middle" class="bigmono">S2</text>
  <text x="1055" y="1745" text-anchor="middle" class="monoSmall">A2+B2+C2+D2</text>
  <rect x="1190" y="1718" width="310" height="42" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="1190" y="1718" width="84" height="42" rx="10" fill="#fed7aa" stroke="none"/>
  <text x="1232" y="1745" text-anchor="middle" class="tag">GPU3</text>
  <text x="1316" y="1746" text-anchor="middle" class="bigmono">S3</text>
  <text x="1415" y="1745" text-anchor="middle" class="monoSmall">A3+B3+C3+D3</text>
</svg>
