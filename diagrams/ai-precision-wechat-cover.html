<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Precision WeChat Cover</title>
  <style>
    html,
    body {
      margin: 0;
      width: 1800px;
      height: 766px;
      overflow: hidden;
      background: #f8fbff;
    }

    .cover {
      position: relative;
      width: 1800px;
      height: 766px;
      overflow: hidden;
      background: #f8fbff;
      isolation: isolate;
    }

    .backdrop {
      position: absolute;
      inset: -70px;
      width: calc(100% + 140px);
      height: calc(100% + 140px);
      object-fit: cover;
      object-position: center top;
      filter: blur(30px) saturate(1.18) brightness(1.03);
      opacity: 0.82;
      transform: scale(1.04);
    }

    .wash {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(248, 251, 255, 0.78), transparent 16%, transparent 84%, rgba(248, 251, 255, 0.78)),
        radial-gradient(circle at 18% 16%, rgba(37, 99, 235, 0.12), transparent 36%),
        radial-gradient(circle at 88% 20%, rgba(22, 163, 74, 0.10), transparent 32%),
        rgba(255, 255, 255, 0.28);
    }

    .main {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: drop-shadow(0 18px 30px rgba(24, 64, 135, 0.14));
    }
  </style>
</head>
<body>
  <main class="cover">
    <img class="backdrop" src="ai-precision-wechat-cover-source.png" alt="">
    <div class="wash"></div>
    <img class="main" src="ai-precision-wechat-cover-source.png" alt="从π到大模型，一文讲清 AI 精度">
  </main>
</body>
</html>
