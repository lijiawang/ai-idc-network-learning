<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.section { font-size: 17px; font-weight: 700; }
.label { font-size: 15px; font-weight: 650; }
.body { font-size: 14px; fill: #374151; }
.small { font-size: 12px; fill: #6b7280; }
.tiny { font-size: 11px; fill: #6b7280; }
.mono { font-size: 13px; fill: #374151; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#0d9488"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/></marker>
<marker id="arrow-gray-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#6b7280"/></marker>
<marker id="arrow-green-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="760" rx="0" ry="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="18" y="18" width="1244" height="724" rx="18" ry="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="640.0" y="56" class="title" text-anchor="middle">DeepEP dispatch / combine 数据流</text>
<text x="640.0" y="86" class="subtitle" text-anchor="middle">MoE 的 All-to-All 被拆成发出去和收回来两条专用路径，中间保留 handle</text>
<rect x="72" y="190" width="158" height="116" rx="12" ry="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="151.0" y="233" class="label" text-anchor="middle" fill="#7c3aed">router 输出</text>
<text x="151.0" y="260" class="small" text-anchor="middle">token -&gt; expert</text>
<text x="151.0" y="280" class="small" text-anchor="middle">expert -&gt; GPU</text>
<line x1="230" y1="248" x2="256" y2="248" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="270" y="190" width="178" height="116" rx="12" ry="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
<text x="359.0" y="233" class="label" text-anchor="middle" fill="#ea580c">发送布局</text>
<text x="359.0" y="260" class="small" text-anchor="middle">按目标 GPU 分组</text>
<text x="359.0" y="280" class="small" text-anchor="middle">整理成连续块</text>
<line x1="448" y1="248" x2="476" y2="248" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="490" y="190" width="178" height="116" rx="12" ry="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="579.0" y="233" class="label" text-anchor="middle" fill="#2563eb">dispatch 通信</text>
<text x="579.0" y="260" class="small" text-anchor="middle">发到目标 GPU</text>
<text x="579.0" y="280" class="small" text-anchor="middle">生成 handle</text>
<line x1="668" y1="248" x2="696" y2="248" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="710" y="190" width="178" height="116" rx="12" ry="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
<text x="799.0" y="233" class="label" text-anchor="middle" fill="#0d9488">expert 布局</text>
<text x="799.0" y="260" class="small" text-anchor="middle">收到即适合计算</text>
<text x="799.0" y="280" class="small" text-anchor="middle">减少再整理</text>
<line x1="888" y1="248" x2="916" y2="248" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="930" y="190" width="158" height="116" rx="12" ry="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="1009.0" y="233" class="label" text-anchor="middle" fill="#16a34a">expert 计算</text>
<text x="1009.0" y="260" class="small" text-anchor="middle">MLP / GEMM</text>
<text x="1009.0" y="280" class="small" text-anchor="middle">输出结果</text>
<rect x="480" y="354" width="330" height="58" rx="12" ry="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
<text x="506" y="389" class="label" text-anchor="start" fill="#ea580c">handle</text>
<text x="590" y="389" class="body" text-anchor="start">记录 token 路线、偏移、合并信息</text>
<line x1="579" y1="306" x2="604" y2="354" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)" stroke-dasharray="5 5"/>
<rect x="930" y="486" width="158" height="116" rx="12" ry="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1009.0" y="529" class="label" text-anchor="middle" fill="#ea580c">结果打包</text>
<text x="1009.0" y="556" class="small" text-anchor="middle">expert 输出</text>
<text x="1009.0" y="576" class="small" text-anchor="middle">准备回传</text>
<line x1="930" y1="544" x2="902" y2="544" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="710" y="486" width="178" height="116" rx="12" ry="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="799.0" y="529" class="label" text-anchor="middle" fill="#16a34a">combine 回传</text>
<text x="799.0" y="556" class="small" text-anchor="middle">按 handle 返程</text>
<text x="799.0" y="576" class="small" text-anchor="middle">跨 GPU 收回</text>
<line x1="710" y1="544" x2="682" y2="544" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="490" y="486" width="178" height="116" rx="12" ry="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="579.0" y="529" class="label" text-anchor="middle" fill="#7c3aed">恢复原位</text>
<text x="579.0" y="556" class="small" text-anchor="middle">回到原 token 顺序</text>
<text x="579.0" y="576" class="small" text-anchor="middle">对齐 batch</text>
<line x1="490" y1="544" x2="462" y2="544" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="270" y="486" width="178" height="116" rx="12" ry="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
<text x="359.0" y="529" class="label" text-anchor="middle" fill="#0d9488">top-k 合并</text>
<text x="359.0" y="556" class="small" text-anchor="middle">多个 expert 输出</text>
<text x="359.0" y="576" class="small" text-anchor="middle">按 weight 加权</text>
<line x1="270" y1="544" x2="244" y2="544" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="72" y="486" width="158" height="116" rx="12" ry="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="151.0" y="529" class="label" text-anchor="middle" fill="#2563eb">MoE 输出</text>
<text x="151.0" y="556" class="small" text-anchor="middle">继续后续层计算</text>
<path d="M1010,306 C1148,354 1148,440 1010,486" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<line x1="646" y1="412" x2="800" y2="486" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)" stroke-dasharray="5 5"/>
<rect x="240" y="668" width="800" height="36" rx="10" ry="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.1"/>
<text x="640" y="692" class="small" text-anchor="middle">dispatch 负责发得快，combine 负责回得准；这两步一起替代普通 MoE 周边的大量手工搬运</text>
</svg>