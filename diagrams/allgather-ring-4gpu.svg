<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    text { font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#111827; }.title{font-size:25px;font-weight:700}.h{font-size:17px;font-weight:700}.sub{font-size:13px;fill:#4b5563}.small{font-size:12px}.mono{font-family:Menlo,Monaco,monospace;font-size:14px}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.cell{stroke:#fff;stroke-width:1}.blue{fill:none;stroke:#2563eb;stroke-width:2.5}.purple{fill:none;stroke:#9333ea;stroke-width:2.5}.green{fill:none;stroke:#16a34a;stroke-width:2.5}.orange{fill:none;stroke:#ea580c;stroke-width:2.5}
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#9333ea"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#16a34a"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#ea580c"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <text x="60" y="48" class="title">4 GPU Ring AllGather：每一步发生什么</text>
  <text x="60" y="76" class="sub">AllGather 接在 ReduceScatter 之后。Ring：GPU0 → GPU1 → GPU2 → GPU3 → GPU0；每张卡初始只拥有自己的有效结果 Sᵣ。</text>

  <rect x="60" y="105" width="1080" height="135" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="135" class="h">0. 开始前：每张 GPU 只有一个有效 chunk</text>
  <text x="84" y="158" class="sub">S0=A0+B0+C0+D0；S1、S2、S3 同理。其他缓冲区位置是 AllGather 的输出空间，不是输入。</text>
  <g transform="translate(100,180)">
    <rect x="0" y="0" width="190" height="36" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="95" y="23" text-anchor="middle" class="mono">GPU0 持有 S0</text>
    <rect x="260" y="0" width="190" height="36" rx="6" fill="#e9d5ff" stroke="#c4b5fd"/><text x="355" y="23" text-anchor="middle" class="mono">GPU1 持有 S1</text>
    <rect x="520" y="0" width="190" height="36" rx="6" fill="#dcfce7" stroke="#86efac"/><text x="615" y="23" text-anchor="middle" class="mono">GPU2 持有 S2</text>
    <rect x="780" y="0" width="190" height="36" rx="6" fill="#fed7aa" stroke="#fdba74"/><text x="875" y="23" text-anchor="middle" class="mono">GPU3 持有 S3</text>
  </g>

  <text x="60" y="282" class="h">1. 三轮错位环传：每轮发送“刚收到的或本来拥有的”一个完整 S chunk</text>
  <text x="60" y="305" class="sub">AllGather 不做加法；接收端只是把收到的 S chunk 放入输出缓冲区中对应的位置。</text>
  <g transform="translate(60,327)">
    <rect x="0" y="0" width="1080" height="220" rx="8" class="box"/>
    <rect x="0" y="0" width="150" height="42" fill="#f1f5f9" class="box"/><rect x="150" y="0" width="310" height="42" fill="#eff6ff" class="box"/><rect x="460" y="0" width="310" height="42" fill="#faf5ff" class="box"/><rect x="770" y="0" width="310" height="42" fill="#f0fdf4" class="box"/>
    <text x="75" y="27" text-anchor="middle" class="h">方向 / 轮次</text><text x="305" y="27" text-anchor="middle" class="h">第 1 轮</text><text x="615" y="27" text-anchor="middle" class="h">第 2 轮</text><text x="925" y="27" text-anchor="middle" class="h">第 3 轮</text>
    <g class="mono">
      <text x="18" y="74">GPU0 → GPU1</text><text x="170" y="74">S0</text><text x="480" y="74">S3</text><text x="790" y="74">S2</text>
      <text x="18" y="114">GPU1 → GPU2</text><text x="170" y="114">S1</text><text x="480" y="114">S0</text><text x="790" y="114">S3</text>
      <text x="18" y="154">GPU2 → GPU3</text><text x="170" y="154">S2</text><text x="480" y="154">S1</text><text x="790" y="154">S0</text>
      <text x="18" y="194">GPU3 → GPU0</text><text x="170" y="194">S3</text><text x="480" y="194">S2</text><text x="790" y="194">S1</text>
    </g>
    <path d="M150,82 L450,82" class="blue" marker-end="url(#ab)"/><path d="M460,82 L760,82" class="blue" marker-end="url(#ab)"/><path d="M770,82 L1070,82" class="blue" marker-end="url(#ab)"/>
    <path d="M150,122 L450,122" class="purple" marker-end="url(#ap)"/><path d="M460,122 L760,122" class="purple" marker-end="url(#ap)"/><path d="M770,122 L1070,122" class="purple" marker-end="url(#ap)"/>
    <path d="M150,162 L450,162" class="green" marker-end="url(#ag)"/><path d="M460,162 L760,162" class="green" marker-end="url(#ag)"/><path d="M770,162 L1070,162" class="green" marker-end="url(#ag)"/>
    <path d="M150,202 L450,202" class="orange" marker-end="url(#ao)"/><path d="M460,202 L760,202" class="orange" marker-end="url(#ao)"/><path d="M770,202 L1070,202" class="orange" marker-end="url(#ao)"/>
  </g>

  <rect x="60" y="575" width="1080" height="112" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="84" y="605" class="h">2. 每一轮结束后，各 GPU 已收集到什么？</text>
  <text x="84" y="633" class="mono">第 1 轮后：GPU0=[S0,S3]  GPU1=[S1,S0]  GPU2=[S2,S1]  GPU3=[S3,S2]</text>
  <text x="84" y="658" class="mono">第 2 轮后：GPU0=[S0,S3,S2]  GPU1=[S1,S0,S3]  GPU2=[S2,S1,S0]  GPU3=[S3,S2,S1]</text>

  <rect x="60" y="716" width="1080" height="116" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="84" y="747" class="h">3. 第 3 轮后：每张 GPU 都得到完整全局归约张量</text>
  <text x="84" y="776" class="sub">内存里的排列按 global chunk 编号写入，因此四张 GPU 的用户可见输出完全一致：</text>
  <text x="84" y="804" class="mono">GPU0 = GPU1 = GPU2 = GPU3 = [S0, S1, S2, S3]</text>
  <g transform="translate(84,862)"><line x1="0" y1="0" x2="32" y2="0" class="blue" marker-end="url(#ab)"/><text x="42" y="4" class="small">每轮沿 Ring 前进一跳</text><line x1="250" y1="0" x2="282" y2="0" class="purple" marker-end="url(#ap)"/><text x="292" y="4" class="small">不同 S chunk 错位并发传输</text></g>
</svg>
