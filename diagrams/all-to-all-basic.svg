<text x="56" y="54" class="title" text-anchor="start">All-to-All：按目标 GPU 重新分发数据块</text>
<text x="56" y="86" class="subtitle" text-anchor="start">每张 GPU 先把数据按目的地分块；通信库同时发、同时收；最后每张 GPU 拿到属于自己的那一组。</text>
