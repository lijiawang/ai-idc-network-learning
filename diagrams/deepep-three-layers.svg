<marker id="arrow-green-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,4 L10,8 Z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" rx="0" ry="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="18" y="18" width="1244" height="684" rx="18" ry="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="640.0" y="56" class="title" text-anchor="middle">All-to-All / NCCL / DeepEP 三层关系</text>
<text x="640.0" y="86" class="subtitle" text-anchor="middle">先分清：通信模式、通用通信工具、MoE 专用通信库不是同一层东西</text>
