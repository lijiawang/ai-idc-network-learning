<circle cx="215" cy="177" r="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="167" cy="217" r="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="215" cy="217" r="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="270" y="184" class="section" text-anchor="start" fill="#2563eb">All-to-All</text>
<text x="270" y="212" class="body" text-anchor="start">通信模式</text>
<text x="624" y="188" class="section" text-anchor="middle" fill="#111827">大家互相发货</text>
<text x="974" y="179" class="small" text-anchor="start">描述通信形状</text>
<text x="974" y="201" class="small" text-anchor="start">不是某一个库</text>
<rect x="126" y="306" width="1028" height="122" rx="16" ry="16" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<rect x="150" y="331" width="82" height="72" rx="12" ry="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.4"/>
<rect x="161" y="343" width="60" height="48" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<line x1="173" y1="357" x2="209" y2="357" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/>
<line x1="173" y1="370" x2="209" y2="370" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/>
<line x1="173" y1="383" x2="209" y2="383" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="171" cy="357" r="3" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<circle cx="211" cy="383" r="3" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="270" y="354" class="section" text-anchor="start" fill="#0d9488">NCCL</text>
<text x="270" y="382" class="body" text-anchor="start">通用通信工具</text>
<text x="624" y="358" class="section" text-anchor="middle" fill="#111827">通用货车，负责搬 GPU 内存</text>
<text x="974" y="349" class="small" text-anchor="start">能做多种集合通信</text>
<text x="974" y="371" class="small" text-anchor="start">也可以承载 All-to-All 能力</text>
<rect x="126" y="476" width="1028" height="122" rx="16" ry="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<rect x="150" y="501" width="82" height="72" rx="12" ry="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.4"/>
<rect x="157" y="511" width="68" height="52" rx="10" ry="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<line x1="169" y1="522" x2="211" y2="522" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<line x1="169" y1="537" x2="211" y2="537" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<line x1="169" y1="552" x2="211" y2="552" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<circle cx="167" cy="522" r="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<circle cx="167" cy="537" r="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<circle cx="167" cy="552" r="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
<text x="270" y="524" class="section" text-anchor="start" fill="#ea580c">DeepEP</text>
<text x="270" y="552" class="body" text-anchor="start">MoE 专用通信库</text>
<text x="624" y="528" class="section" text-anchor="middle" fill="#111827">自动分拣中心 + 专用运输流水线</text>
<text x="974" y="519" class="small" text-anchor="start">把 MoE dispatch / combine 做快</text>
<text x="974" y="541" class="small" text-anchor="start">底层可借用 NCCL Gin backend</text>
<path d="M640,258 L640,292" fill="none" stroke="gray" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<path d="M640,428 L640,462" fill="none" stroke="gray" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
<text x="668" y="281" class="tiny" text-anchor="start">可以用工具实现</text>
<text x="668" y="451" class="tiny" text-anchor="start">面向 MoE 做专用化</text>
<rect x="238" y="633" width="804" height="42" rx="10" ry="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="640" y="660" class="body" text-anchor="middle">用了 DeepEP，不是没有 All-to-All；而是 MoE 的 All-to-All 由 dispatch / combine 高效完成</text>
</svg>