<rect x="207.0" y="260" width="38" height="28" rx="8" ry="8" fill="#fef3c7" stroke="#ffffff" stroke-width="1.2"/>
<text x="226.0" y="279.0" class="chip" text-anchor="middle">t0c</text>
<rect x="86" y="310" width="188" height="98" rx="16" ry="16" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.8" filter="url(#soft)"/>
<text x="180.0" y="342" class="label" text-anchor="middle">GPU1</text>
<text x="180.0" y="364" class="tiny" text-anchor="middle">一批 token</text>
<rect x="115.0" y="378" width="38" height="28" rx="8" ry="8" fill="#dbeafe" stroke="#ffffff" stroke-width="1.2"/>
<text x="134.0" y="397.0" class="chip" text-anchor="middle">t1a</text>
