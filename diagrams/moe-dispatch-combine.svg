<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 800; letter-spacing: 0; }
.subtitle { font-size: 15px; fill: #64748b; }
.section { font-size: 17px; font-weight: 750; fill: #0f172a; }
.label { font-size: 15px; font-weight: 700; fill: #111827; }
.small { font-size: 13px; fill: #64748b; }
.tiny { font-size: 12px; fill: #64748b; }
.chip { font-size: 13px; font-weight: 800; fill: #111827; }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f8fbff"/>
<stop offset="1" stop-color="#ffffff"/>
</linearGradient>
<filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
</filter>
<filter id="soft" x="-10%" y="-15%" width="120%" height="130%">
<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
</filter>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#9333ea"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
</defs>
<rect width="1400" height="840" fill="url(#bg)"/>
<text x="56" y="54" class="title" text-anchor="start">MoE 中的 All-to-All：token 去找 expert</text>
<text x="56" y="86" class="subtitle" text-anchor="start">router 决定 token 去哪个 expert；dispatch 负责送过去；expert 算完后，combine 再把结果送回原位置。</text>
<text x="180" y="146" class="section" text-anchor="middle">1. 输入 token</text>
<text x="420" y="146" class="section" text-anchor="middle">2. Router 分桶</text>
<text x="690" y="146" class="section" text-anchor="middle">3. Dispatch</text>
<text x="960" y="146" class="section" text-anchor="middle">4. Expert 计算</text>
<text x="1220" y="146" class="section" text-anchor="middle">5. Combine 送回</text>
<rect x="86" y="192" width="188" height="98" rx="16" ry="16" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.8" filter="url(#soft)"/>
<text x="180.0" y="224" class="label" text-anchor="middle">GPU0</text>
<text x="180.0" y="246" class="tiny" text-anchor="middle">一批 token</text>
<rect x="115.0" y="260" width="38" height="28" rx="8" ry="8" fill="#dbeafe" stroke="#ffffff" stroke-width="1.2"/>
<text x="134.0" y="279.0" class="chip" text-anchor="middle">t0a</text>
<rect x="161.0" y="260" width="38" height="28" rx="8" ry="8" fill="#dcfce7" stroke="#ffffff" stroke-width="1.2"/>
