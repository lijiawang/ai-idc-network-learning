<rect x="880" y="428" width="188" height="98" rx="16" ry="16" fill="#eefdf5" stroke="#bbf7d0" stroke-width="1.8" filter="url(#soft)"/>
<text x="974.0" y="460" class="label" text-anchor="middle">GPU2</text>
<text x="974.0" y="482" class="tiny" text-anchor="middle">Expert 2</text>
<rect x="925" y="486" width="98" height="30" rx="12" ry="12" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
<text x="974.0" y="506.0" class="small" text-anchor="middle" style="fill:#16a34a;font-weight:750">算 expert</text>
<rect x="880" y="546" width="188" height="98" rx="16" ry="16" fill="#eefdf5" stroke="#bbf7d0" stroke-width="1.8" filter="url(#soft)"/>
<text x="974.0" y="578" class="label" text-anchor="middle">GPU3</text>
<text x="974.0" y="600" class="tiny" text-anchor="middle">Expert 3</text>
<rect x="925" y="604" width="98" height="30" rx="12" ry="12" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
<text x="974.0" y="624.0" class="small" text-anchor="middle" style="fill:#16a34a;font-weight:750">算 expert</text>
<rect x="1162" y="270" width="176" height="300" rx="20" ry="20" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.8" filter="url(#shadow)"/>
<text x="1250" y="318" class="section" text-anchor="middle" style="fill:#9333ea">Combine</text>
<text x="1250" y="372" class="small" text-anchor="middle">第二次 All-to-All</text>
<text x="1250" y="408" class="small" text-anchor="middle">把 expert 结果</text>
<text x="1250" y="438" class="small" text-anchor="middle">送回原 token 位置</text>
<line x1="274" y1="241" x2="336" y2="241" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
