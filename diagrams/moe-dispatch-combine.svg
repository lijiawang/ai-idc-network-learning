<line x1="78" y1="792" x2="120" y2="792" stroke="#2563eb" stroke-width="2.3" fill="none" marker-end="url(#arrow-blue)"/>
<text x="134" y="797" class="tiny" text-anchor="start">dispatch 派送</text>
