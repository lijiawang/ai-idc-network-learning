<text x="421" y="232" class="section" text-anchor="middle" style="fill:#ea580c">Router</text>
<text x="421" y="256" class="tiny" text-anchor="middle">逻辑示意，非中央服务</text>
<text x="421" y="286" class="small" text-anchor="middle">各 rank 本地路由</text>
<text x="421" y="316" class="small" text-anchor="middle">按 token 分桶到 expert</text>
<rect x="366" y="360" width="110" height="36" rx="12" ry="12" fill="#dbeafe" stroke="#ffffff" stroke-width="1.3"/>
<text x="421.0" y="383.0" class="small" text-anchor="middle" style="fill:#475569;font-weight:750">去 E0</text>
<rect x="366" y="416" width="110" height="36" rx="12" ry="12" fill="#dcfce7" stroke="#ffffff" stroke-width="1.3"/>
<text x="421.0" y="439.0" class="small" text-anchor="middle" style="fill:#475569;font-weight:750">去 E1</text>
<rect x="366" y="472" width="110" height="36" rx="12" ry="12" fill="#fef3c7" stroke="#ffffff" stroke-width="1.3"/>
<text x="421.0" y="495.0" class="small" text-anchor="middle" style="fill:#475569;font-weight:750">去 E2</text>
<rect x="366" y="528" width="110" height="36" rx="12" ry="12" fill="#fce7f3" stroke="#ffffff" stroke-width="1.3"/>
<text x="421.0" y="551.0" class="small" text-anchor="middle" style="fill:#475569;font-weight:750">去 E3</text>
<rect x="608" y="270" width="176" height="300" rx="20" ry="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8" filter="url(#shadow)"/>
<text x="696" y="318" class="section" text-anchor="middle" style="fill:#2563eb">Dispatch</text>
<text x="696" y="372" class="small" text-anchor="middle">第一次 All-to-All</text>
<text x="696" y="408" class="small" text-anchor="middle">把 token 送到</text>
<text x="696" y="438" class="small" text-anchor="middle">expert 所在 GPU</text>
