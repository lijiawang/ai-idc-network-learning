<rect x="207.0" y="496" width="38" height="28" rx="8" ry="8" fill="#fef3c7" stroke="#ffffff" stroke-width="1.2"/>
<text x="226.0" y="515.0" class="chip" text-anchor="middle">t2c</text>
<rect x="86" y="546" width="188" height="98" rx="16" ry="16" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.8" filter="url(#soft)"/>
<text x="180.0" y="578" class="label" text-anchor="middle">GPU3</text>
<text x="180.0" y="600" class="tiny" text-anchor="middle">一批 token</text>
<rect x="115.0" y="614" width="38" height="28" rx="8" ry="8" fill="#dbeafe" stroke="#ffffff" stroke-width="1.2"/>
<text x="134.0" y="633.0" class="chip" text-anchor="middle">t3a</text>
<rect x="161.0" y="614" width="38" height="28" rx="8" ry="8" fill="#dcfce7" stroke="#ffffff" stroke-width="1.2"/>
