<text x="700" y="790" class="label" text-anchor="middle">一层 MoE 的节奏：路由分桶 -&gt; 派送 token -&gt; expert 计算 -&gt; 结果送回</text>
<rect x="56" y="724" width="260" height="92" rx="16" ry="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="76" y="748" class="small" text-anchor="start" style="font-weight:750">图例</text>
