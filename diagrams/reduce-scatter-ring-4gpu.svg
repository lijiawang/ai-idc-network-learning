<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#111827; }
    .title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.sub{font-size:14px;fill:#4b5563}.small{font-size:12px;fill:#6b7280}.mono{font-family:Menlo,Monaco,Consolas,monospace;font-size:13px}.mono2{font-family:Menlo,Monaco,Consolas,monospace;font-size:15px;font-weight:600}.gpu{fill:#fff;stroke:#9ca3af;stroke-width:1.5}.cell{stroke:#fff;stroke-width:1}.grid{fill:#fff;stroke:#d1d5db;stroke-width:1}.note{fill:#f9fafb;stroke:#d1d5db;stroke-width:1.2}.blue{stroke:#2563eb;fill:none;stroke-width:2.6}.purple{stroke:#9333ea;fill:none;stroke-width:2.6}.green{stroke:#16a34a;fill:none;stroke-width:2.6}.orange{stroke:#ea580c;fill:none;stroke-width:2.6}.red{stroke:#dc2626;fill:none;stroke-width:2.2}.dash{stroke-dasharray:6 4}.chip{font-size:12px;font-weight:700}.owner{font-size:13px;font-weight:600}.tag{font-size:12px;fill:#374151;font-weight:600}
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#9333ea"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#16a34a"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="1280" fill="#ffffff"/>
  <text x="60" y="48" class="title">4 GPU Ring ReduceScatter：为什么 GPU0 第一轮从 A3 开始？</text>
  <text x="60" y="78" class="sub">例：GPU0=[A0,A1,A2,A3]，GPU1=[B0,B1,B2,B3]，GPU2=[C0,C1,C2,C3]，GPU3=[D0,D1,D2,D3]。Ring：GPU0 → GPU1 → GPU2 → GPU3 → GPU0。</text>
  <rect x="60" y="108" width="1080" height="158" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="139" class="h">0. 开始前：每张 GPU 都有完整输入 M，按 chunk 编号切成 4 份</text>
  <text x="84" y="164" class="sub">数字 0/1/2/3 表示 chunk 编号；最终 ReduceScatter 要让 chunk i 的全局和 Sᵢ 停在 GPUi。</text>
  <g transform="translate(85,210)">
    <text x="0" y="-10" class="h">GPU0</text>
    <rect x="0" y="0" width="210" height="40" class="gpu" rx="7"/>
    <rect x="0.0" y="0" width="52.5" height="40" fill="#dbeafe" class="cell"/>
    <text x="26.25" y="26" text-anchor="middle" class="mono2">A0</text>
    <rect x="52.5" y="0" width="52.5" height="40" fill="#e9d5ff" class="cell"/>
    <text x="78.75" y="26" text-anchor="middle" class="mono2">A1</text>
    <rect x="105.0" y="0" width="52.5" height="40" fill="#dcfce7" class="cell"/>
    <text x="131.25" y="26" text-anchor="middle" class="mono2">A2</text>
    <rect x="157.5" y="0" width="52.5" height="40" fill="#fed7aa" class="cell"/>
    <text x="183.75" y="26" text-anchor="middle" class="mono2">A3</text>
  </g>
  <g transform="translate(355,210)">
    <text x="0" y="-10" class="h">GPU1</text>
    <rect x="0" y="0" width="210" height="40" class="gpu" rx="7"/>
    <rect x="0.0" y="0" width="52.5" height="40" fill="#dbeafe" class="cell"/>
    <text x="26.25" y="26" text-anchor="middle" class="mono2">B0</text>
    <rect x="52.5" y="0" width="52.5" height="40" fill="#e9d5ff" class="cell"/>
    <text x="78.75" y="26" text-anchor="middle" class="mono2">B1</text>
    <rect x="105.0" y="0" width="52.5" height="40" fill="#dcfce7" class="cell"/>
    <text x="131.25" y="26" text-anchor="middle" class="mono2">B2</text>
    <rect x="157.5" y="0" width="52.5" height="40" fill="#fed7aa" class="cell"/>
    <text x="183.75" y="26" text-anchor="middle" class="mono2">B3</text>
  </g>
  <g transform="translate(625,210)">
    <text x="0" y="-10" class="h">GPU2</text>
    <rect x="0" y="0" width="210" height="40" class="gpu" rx="7"/>
    <rect x="0.0" y="0" width="52.5" height="40" fill="#dbeafe" class="cell"/>
    <text x="26.25" y="26" text-anchor="middle" class="mono2">C0</text>
    <rect x="52.5" y="0" width="52.5" height="40" fill="#e9d5ff" class="cell"/>
    <text x="78.75" y="26" text-anchor="middle" class="mono2">C1</text>
    <rect x="105.0" y="0" width="52.5" height="40" fill="#dcfce7" class="cell"/>
    <text x="131.25" y="26" text-anchor="middle" class="mono2">C2</text>
    <rect x="157.5" y="0" width="52.5" height="40" fill="#fed7aa" class="cell"/>
    <text x="183.75" y="26" text-anchor="middle" class="mono2">C3</text>
  </g>
  <g transform="translate(895,210)">
    <text x="0" y="-10" class="h">GPU3</text>
    <rect x="0" y="0" width="210" height="40" class="gpu" rx="7"/>
    <rect x="0.0" y="0" width="52.5" height="40" fill="#dbeafe" class="cell"/>
    <text x="26.25" y="26" text-anchor="middle" class="mono2">D0</text>
    <rect x="52.5" y="0" width="52.5" height="40" fill="#e9d5ff" class="cell"/>
    <text x="78.75" y="26" text-anchor="middle" class="mono2">D1</text>
    <rect x="105.0" y="0" width="52.5" height="40" fill="#dcfce7" class="cell"/>
    <text x="131.25" y="26" text-anchor="middle" class="mono2">D2</text>
    <rect x="157.5" y="0" width="52.5" height="40" fill="#fed7aa" class="cell"/>
    <text x="183.75" y="26" text-anchor="middle" class="mono2">D3</text>
  </g>
  <text x="60" y="315" class="h">1. 先记住“停靠站”：ReduceScatter 最终不是每张卡都有完整 M，而是每张卡只拿一个全局和</text>
  <rect x="60" y="337" width="1080" height="130" rx="12" class="note"/>
  <rect x="88" y="363" width="230" height="76" rx="9" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="203" y="386" text-anchor="middle" class="owner">chunk0</text>
  <text x="203" y="408" text-anchor="middle" class="mono">S0=A0+B0+C0+D0</text>
  <text x="203" y="430" text-anchor="middle" class="tag">最终停 GPU0</text>
  <rect x="348" y="363" width="230" height="76" rx="9" fill="#e9d5ff" stroke="#cbd5e1"/>
  <text x="463" y="386" text-anchor="middle" class="owner">chunk1</text>
  <text x="463" y="408" text-anchor="middle" class="mono">S1=A1+B1+C1+D1</text>
  <text x="463" y="430" text-anchor="middle" class="tag">最终停 GPU1</text>
  <rect x="608" y="363" width="230" height="76" rx="9" fill="#dcfce7" stroke="#cbd5e1"/>
  <text x="723" y="386" text-anchor="middle" class="owner">chunk2</text>
  <text x="723" y="408" text-anchor="middle" class="mono">S2=A2+B2+C2+D2</text>
  <text x="723" y="430" text-anchor="middle" class="tag">最终停 GPU2</text>
  <rect x="868" y="363" width="230" height="76" rx="9" fill="#fed7aa" stroke="#cbd5e1"/>
  <text x="983" y="386" text-anchor="middle" class="owner">chunk3</text>
  <text x="983" y="408" text-anchor="middle" class="mono">S3=A3+B3+C3+D3</text>
  <text x="983" y="430" text-anchor="middle" class="tag">最终停 GPU3</text>
  <text x="60" y="520" class="h">2. 为什么 GPU0 第一轮发 A3？因为 A3 的“目的地”是 GPU3，不是 GPU0</text>
  <rect x="60" y="542" width="1080" height="176" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="84" y="572" class="sub">这只是 Ring 的一种固定错位调度。核心思想：每个 chunk 沿着环走，经过其它 GPU 时不断累加，最后停在自己的编号 GPU。</text>
  <text x="84" y="599" class="sub">对 GPU0 来说，第一轮把 chunk3 的 A3 送给 GPU1；之后它会继续走到 GPU2、GPU3，最后在 GPU3 变成 S3。</text>
  <g transform="translate(110,630)">
    <rect x="0" y="0" width="130" height="48" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="65" y="30" text-anchor="middle" class="h">GPU0</text>
    <rect x="230" y="0" width="130" height="48" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="295" y="30" text-anchor="middle" class="h">GPU1</text>
    <rect x="460" y="0" width="130" height="48" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="525" y="30" text-anchor="middle" class="h">GPU2</text>
    <rect x="690" y="0" width="130" height="48" rx="9" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="755" y="30" text-anchor="middle" class="h">GPU3</text>
    <path d="M 130,24 L 224,24" class="orange" marker-end="url(#ao)"/>
    <rect x="138" y="-15" width="120" height="22" rx="4" fill="#fff7ed" opacity="0.96"/>
    <text x="198" y="1" text-anchor="middle" class="small">第1轮：A3</text>
    <path d="M 360,24 L 454,24" class="orange" marker-end="url(#ao)"/>
    <rect x="368" y="-15" width="120" height="22" rx="4" fill="#fff7ed" opacity="0.96"/>
    <text x="428" y="1" text-anchor="middle" class="small">第2轮：A3+B3</text>
    <path d="M 590,24 L 684,24" class="orange" marker-end="url(#ao)"/>
    <rect x="598" y="-15" width="120" height="22" rx="4" fill="#fff7ed" opacity="0.96"/>
    <text x="658" y="1" text-anchor="middle" class="small">第3轮：A3+B3+C3</text>
    <text x="755" y="75" text-anchor="middle" class="mono2">GPU3 再加 D3 ⇒ S3</text>
  </g>
  <text x="60" y="770" class="h">3. 第 1 轮不是只有 A3 在走，而是四条边同时错位发送</text>
  <rect x="60" y="792" width="1080" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="821" class="sub">第 1 轮发送规则：GPU r 先发 chunk (r−1 mod 4)。所以 GPU0 发 A3，GPU1 发 B0，GPU2 发 C1，GPU3 发 D2。</text>
  <text x="84" y="848" class="sub">注意：发送不会把本地 A3 清零；它只是读出 A3 发给下一个 GPU。接收方收到后，立刻加到自己同编号 chunk 上。</text>
  <text x="96" y="876" class="mono" fill="#2563eb">GPU0 → GPU1</text>
  <text x="252" y="876" class="mono2" fill="#2563eb">发送 A3</text>
  <text x="385" y="876" class="mono">GPU1 做：B3 += A3 ⇒ A3+B3</text>
  <text x="96" y="893" class="mono" fill="#9333ea">GPU1 → GPU2</text>
  <text x="252" y="893" class="mono2" fill="#9333ea">发送 B0</text>
  <text x="385" y="893" class="mono">GPU2 做：C0 += B0 ⇒ B0+C0</text>
  <text x="96" y="910" class="mono" fill="#16a34a">GPU2 → GPU3</text>
  <text x="252" y="910" class="mono2" fill="#16a34a">发送 C1</text>
  <text x="385" y="910" class="mono">GPU3 做：D1 += C1 ⇒ C1+D1</text>
  <text x="96" y="927" class="mono" fill="#ea580c">GPU3 → GPU0</text>
  <text x="252" y="927" class="mono2" fill="#ea580c">发送 D2</text>
  <text x="385" y="927" class="mono">GPU0 做：A2 += D2 ⇒ D2+A2</text>
  <text x="60" y="985" class="h">4. 三轮流水线：每一列是同一轮，四条边同时发生</text>
  <text x="60" y="1009" class="sub">发送的数据会越来越“肥”：第 1 轮是单个源 chunk；第 2 轮已经是两个 GPU 的部分和；第 3 轮是三个 GPU 的部分和，接收方再加自己的一份就完成。</text>
  <g transform="translate(60,1030)">
    <rect x="0" y="0" width="1080" height="192" rx="8" class="grid"/>
    <rect x="0" y="0" width="150" height="40" fill="#f1f5f9" class="grid"/>
    <rect x="150" y="0" width="310" height="40" fill="#eff6ff" class="grid"/>
    <rect x="460" y="0" width="310" height="40" fill="#faf5ff" class="grid"/>
    <rect x="770" y="0" width="310" height="40" fill="#f0fdf4" class="grid"/>
    <text x="75" y="26" text-anchor="middle" class="h">方向 / 轮次</text>
    <text x="305" y="26" text-anchor="middle" class="h">第 1 轮</text>
    <text x="615" y="26" text-anchor="middle" class="h">第 2 轮</text>
    <text x="925" y="26" text-anchor="middle" class="h">第 3 轮</text>
    <line x1="0" y1="40" x2="1080" y2="40" stroke="#e5e7eb"/>
    <line x1="0" y1="78" x2="1080" y2="78" stroke="#e5e7eb"/>
    <line x1="0" y1="116" x2="1080" y2="116" stroke="#e5e7eb"/>
    <line x1="0" y1="154" x2="1080" y2="154" stroke="#e5e7eb"/>
    <line x1="0" y1="192" x2="1080" y2="192" stroke="#e5e7eb"/>
    <line x1="150" y1="0" x2="150" y2="192" stroke="#e5e7eb"/>
    <line x1="460" y1="0" x2="460" y2="192" stroke="#e5e7eb"/>
    <line x1="770" y1="0" x2="770" y2="192" stroke="#e5e7eb"/>
    <text x="18" y="65" class="mono">GPU0 → GPU1</text>
    <text x="172" y="65" class="mono2" fill="#2563eb">A3</text>
    <text x="482" y="65" class="mono2" fill="#2563eb">D2 + A2</text>
    <text x="792" y="65" class="mono2" fill="#2563eb">C1 + D1 + A1</text>
    <text x="18" y="103" class="mono">GPU1 → GPU2</text>
    <text x="172" y="103" class="mono2" fill="#9333ea">B0</text>
    <text x="482" y="103" class="mono2" fill="#9333ea">A3 + B3</text>
    <text x="792" y="103" class="mono2" fill="#9333ea">D2 + A2 + B2</text>
    <text x="18" y="141" class="mono">GPU2 → GPU3</text>
    <text x="172" y="141" class="mono2" fill="#16a34a">C1</text>
    <text x="482" y="141" class="mono2" fill="#16a34a">B0 + C0</text>
    <text x="792" y="141" class="mono2" fill="#16a34a">A3 + B3 + C3</text>
    <text x="18" y="179" class="mono">GPU3 → GPU0</text>
    <text x="172" y="179" class="mono2" fill="#ea580c">D2</text>
    <text x="482" y="179" class="mono2" fill="#ea580c">C1 + D1</text>
    <text x="792" y="179" class="mono2" fill="#ea580c">B0 + C0 + D0</text>
    <path d="M 230,72 L 440,72" stroke="#2563eb" stroke-width="2.3" fill="none" marker-end="url(#ab)"/>
    <path d="M 540,72 L 750,72" stroke="#2563eb" stroke-width="2.3" fill="none" marker-end="url(#ab)"/>
    <path d="M 850,72 L 1060,72" stroke="#2563eb" stroke-width="2.3" fill="none" marker-end="url(#ab)"/>
    <path d="M 230,110 L 440,110" stroke="#9333ea" stroke-width="2.3" fill="none" marker-end="url(#ap)"/>
    <path d="M 540,110 L 750,110" stroke="#9333ea" stroke-width="2.3" fill="none" marker-end="url(#ap)"/>
    <path d="M 850,110 L 1060,110" stroke="#9333ea" stroke-width="2.3" fill="none" marker-end="url(#ap)"/>
    <path d="M 230,148 L 440,148" stroke="#16a34a" stroke-width="2.3" fill="none" marker-end="url(#ag)"/>
    <path d="M 540,148 L 750,148" stroke="#16a34a" stroke-width="2.3" fill="none" marker-end="url(#ag)"/>
    <path d="M 850,148 L 1060,148" stroke="#16a34a" stroke-width="2.3" fill="none" marker-end="url(#ag)"/>
    <path d="M 230,186 L 440,186" stroke="#ea580c" stroke-width="2.3" fill="none" marker-end="url(#ao)"/>
    <path d="M 540,186 L 750,186" stroke="#ea580c" stroke-width="2.3" fill="none" marker-end="url(#ao)"/>
    <path d="M 850,186 L 1060,186" stroke="#ea580c" stroke-width="2.3" fill="none" marker-end="url(#ao)"/>
  </g>
  <rect x="60" y="1244" width="1080" height="1" fill="#ffffff"/>
  <g transform="translate(60,1238)">
    <text x="0" y="0" class="small">最终 API 可见结果：GPU0=S0，GPU1=S1，GPU2=S2，GPU3=S3。其它旧槽位即使还在显存里，也不是有效输出。</text>
  </g>
</svg>