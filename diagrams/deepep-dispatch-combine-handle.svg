<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.section { font-size: 17px; font-weight: 700; }
.label { font-size: 15px; font-weight: 650; }
.body { font-size: 14px; fill: #374151; }
.small { font-size: 12px; fill: #6b7280; }
.tiny { font-size: 11px; fill: #6b7280; }
