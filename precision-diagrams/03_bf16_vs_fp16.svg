<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.label { font-size: 15px; font-weight: 600; }
.small { font-size: 12px; fill: #6b7280; }
.note { font-size: 13px; fill: #6b7280; }
.axis { stroke: #9ca3af; stroke-width: 1.5; }
.card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
</style>
<defs>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" class="title">图3：为什么 BF16 常用于大模型训练</text>
<text x="60" y="88" text-anchor="start" class="subtitle">FP16 和 BF16 都是 16 bit，但一个把 bit 更多给尾数，一个把 bit 更多给指数。</text>
<text x="90" y="152" text-anchor="start" class="label">FP16 = 1 + 5 + 10</text>
<rect x="90" y="170" width="28.125" height="54" rx="6" ry="6" fill="#2563eb" stroke="#2563eb" stroke-width="1" />
<rect x="118.125" y="170" width="140.625" height="54" rx="0" ry="0" fill="#dc2626" stroke="#dc2626" stroke-width="1" />
<rect x="258.75" y="170" width="281.25" height="54" rx="6" ry="6" fill="#16a34a" stroke="#16a34a" stroke-width="1" />
<text x="104.0625" y="204" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">S1</text>
<text x="188.4375" y="204" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">E5</text>
<text x="399.375" y="204" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">M10</text>
<text x="90" y="252" text-anchor="start" class="note">尾数多一点：小数细节更细</text>
<text x="650" y="152" text-anchor="start" class="label">BF16 = 1 + 8 + 7</text>
<rect x="650" y="170" width="28.125" height="54" rx="6" ry="6" fill="#2563eb" stroke="#2563eb" stroke-width="1" />
<rect x="678.125" y="170" width="225.0" height="54" rx="0" ry="0" fill="#dc2626" stroke="#dc2626" stroke-width="1" />
<rect x="903.125" y="170" width="196.875" height="54" rx="6" ry="6" fill="#16a34a" stroke="#16a34a" stroke-width="1" />
<text x="664.0625" y="204" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">S1</text>
<text x="790.625" y="204" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">E8</text>
<text x="1001.5625" y="204" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">M7</text>
<text x="650" y="252" text-anchor="start" class="note">指数多一点：范围更大，不容易溢出</text>
<line x1="540" y1="197" x2="630" y2="197" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
<text x="585" y="184" text-anchor="middle" class="small">同样 16 bit</text>
<rect x="95" y="315" width="445" height="230" rx="12" ry="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
<text x="318" y="352" text-anchor="middle" class="label" fill="#ea580c">FP16 的直觉</text>
<text x="318" y="388" text-anchor="middle" font-size="22" font-weight="700">像一个“细刻度但短尺子”</text>
<text x="318" y="424" text-anchor="middle" class="note">能刻得比较细，但尺子不够长</text>
<text x="318" y="450" text-anchor="middle" class="note">遇到特别大/特别小的训练数值时</text>
<text x="318" y="476" text-anchor="middle" class="note">更容易 overflow / underflow</text>
<line x1="165" y1="505" x2="470" y2="505" stroke="#ea580c" stroke-width="4" fill="none"/>
<line x1="165" y1="495" x2="165" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="203" y1="495" x2="203" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="241" y1="495" x2="241" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="279" y1="495" x2="279" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="317" y1="495" x2="317" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="355" y1="495" x2="355" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="393" y1="495" x2="393" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="431" y1="495" x2="431" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<line x1="469" y1="495" x2="469" y2="515" stroke="#ea580c" stroke-width="1.5" fill="none"/>
<rect x="655" y="315" width="445" height="230" rx="12" ry="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
<text x="878" y="352" text-anchor="middle" class="label" fill="#2563eb">BF16 的直觉</text>
<text x="878" y="388" text-anchor="middle" font-size="22" font-weight="700">像一个“刻度粗但长尺子”</text>
<text x="878" y="424" text-anchor="middle" class="note">小数没那么细，但覆盖范围大</text>
<text x="878" y="450" text-anchor="middle" class="note">大模型训练里更稳</text>
<text x="878" y="476" text-anchor="middle" class="note">所以经常优先用 BF16</text>
<line x1="710" y1="505" x2="1045" y2="505" stroke="#2563eb" stroke-width="4" fill="none"/>
<line x1="710" y1="495" x2="710" y2="515" stroke="#2563eb" stroke-width="1.5" fill="none"/>
<line x1="784" y1="495" x2="784" y2="515" stroke="#2563eb" stroke-width="1.5" fill="none"/>
<line x1="858" y1="495" x2="858" y2="515" stroke="#2563eb" stroke-width="1.5" fill="none"/>
<line x1="932" y1="495" x2="932" y2="515" stroke="#2563eb" stroke-width="1.5" fill="none"/>
<line x1="1006" y1="495" x2="1006" y2="515" stroke="#2563eb" stroke-width="1.5" fill="none"/>
<rect x="140" y="610" width="920" height="78" rx="12" ry="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" />
<text x="600" y="645" text-anchor="middle" font-size="18" font-weight="700">一句话：FP16 更细，BF16 更稳；大模型训练怕“数值爆掉”，所以 BF16 很香。</text>
<text x="600" y="672" text-anchor="middle" class="note">真正训练时常是混合精度：低精度算大矩阵，高精度保关键累加/归一化/优化器状态。</text>
</svg>