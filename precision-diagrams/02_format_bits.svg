<text x="723" y="181" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M52</text>
<text x="885" y="181" text-anchor="start" class="small">科学计算：很准，很贵</text>
<rect x="60" y="210" width="1080" height="46" rx="6" ry="6" fill="#f9fafb" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="239" text-anchor="start" class="label">FP32</text>
<text x="170" y="239" text-anchor="start" class="small">32 bit</text>
<rect x="268" y="218" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="239" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="218" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="239" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E8</text>
<rect x="638" y="218" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="239" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M23</text>
