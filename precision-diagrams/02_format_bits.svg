<text x="170" y="307" text-anchor="start" class="small">19 bit 计算</text>
<rect x="268" y="276" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="297" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="276" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="297" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E8</text>
<rect x="638" y="276" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="297" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M10</text>
<text x="885" y="297" text-anchor="start" class="small">不省显存，只加速计算</text>
<rect x="60" y="326" width="1080" height="46" rx="6" ry="6" fill="#f9fafb" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="355" text-anchor="start" class="label">BF16</text>
<text x="170" y="355" text-anchor="start" class="small">16 bit</text>
<rect x="268" y="334" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="355" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="334" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="355" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E8</text>
<rect x="638" y="334" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="355" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M7</text>
<text x="885" y="355" text-anchor="start" class="small">范围像 FP32，小数更粗</text>
<rect x="60" y="384" width="1080" height="46" rx="6" ry="6" fill="#ffffff" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="413" text-anchor="start" class="label">FP16</text>
<text x="170" y="413" text-anchor="start" class="small">16 bit</text>
<rect x="268" y="392" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="413" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="392" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="413" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E5</text>
<rect x="638" y="392" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="413" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M10</text>
<text x="885" y="413" text-anchor="start" class="small">范围小，小数更细</text>
<rect x="60" y="442" width="1080" height="46" rx="6" ry="6" fill="#f9fafb" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="471" text-anchor="start" class="label">FP8 E4M3</text>
<text x="170" y="471" text-anchor="start" class="small">8 bit</text>
<rect x="268" y="450" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="471" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="450" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="471" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E4</text>
<rect x="638" y="450" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="471" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M3</text>
<text x="885" y="471" text-anchor="start" class="small">8-bit 浮点，偏精度</text>
<rect x="60" y="500" width="1080" height="46" rx="6" ry="6" fill="#ffffff" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="529" text-anchor="start" class="label">FP8 E5M2</text>
<text x="170" y="529" text-anchor="start" class="small">8 bit</text>
<rect x="268" y="508" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="529" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="508" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="529" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E5</text>
<rect x="638" y="508" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="529" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M2</text>
<text x="885" y="529" text-anchor="start" class="small">8-bit 浮点，偏范围</text>
<rect x="60" y="558" width="1080" height="46" rx="6" ry="6" fill="#f9fafb" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="587" text-anchor="start" class="label">NVFP4</text>
<text x="170" y="587" text-anchor="start" class="small">4 bit</text>
<rect x="268" y="566" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="587" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="566" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
<text x="493" y="587" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">E2</text>
<rect x="638" y="566" width="170" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="723" y="587" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">M1</text>
<text x="885" y="587" text-anchor="start" class="small">4-bit 浮点，需配合缩放</text>
<rect x="90" y="660" width="1020" height="58" rx="10" ry="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2" />
<text x="115" y="686" text-anchor="start" class="note">注意：如果每一行都画成同样长的总条，S1 在 FP64 中只占 1/64，在 NVFP4 中占 1/4，看起来会一大一小。</text>
<text x="115" y="711" text-anchor="start" class="note">所以这张表改成“字段表格”：所有格式的符号位都明确标为 S1，不再用蓝色块面积暗示符号位大小。</text>
</svg>