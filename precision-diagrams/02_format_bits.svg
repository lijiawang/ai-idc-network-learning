<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.label { font-size: 15px; font-weight: 600; }
.small { font-size: 12px; fill: #6b7280; }
.note { font-size: 13px; fill: #6b7280; }
</style>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" class="title">图2：常见数字格式的位宽分配</text>
<text x="60" y="88" text-anchor="start" class="subtitle">这一版不按面积暗示比例：符号位统一写成 S1，指数位和尾数位用数字标清楚。</text>
<rect x="710" y="32" width="420" height="92" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" />
<rect x="735" y="45" width="16" height="16" rx="4" ry="4" fill="#2563eb" stroke="#2563eb" stroke-width="1" />
<text x="760" y="58" text-anchor="start" class="small">S1 符号位：永远 1 bit</text>
<rect x="735" y="67" width="16" height="16" rx="4" ry="4" fill="#dc2626" stroke="#dc2626" stroke-width="1" />
<text x="760" y="80" text-anchor="start" class="small">E 指数位：管范围</text>
<rect x="735" y="89" width="16" height="16" rx="4" ry="4" fill="#16a34a" stroke="#16a34a" stroke-width="1" />
<text x="760" y="102" text-anchor="start" class="small">M 尾数位：管精度</text>
<text x="70" y="140" text-anchor="start" class="small">格式</text>
<text x="170" y="140" text-anchor="start" class="small">总位宽</text>
<text x="270" y="140" text-anchor="start" class="small">符号位</text>
<text x="420" y="140" text-anchor="start" class="small">指数位</text>
<text x="640" y="140" text-anchor="start" class="small">尾数位</text>
<text x="885" y="140" text-anchor="start" class="small">小白理解</text>
<line x1="60" y1="154" x2="1138" y2="154" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="60" y="152" width="1080" height="46" rx="6" ry="6" fill="#ffffff" stroke="#eef2f7" stroke-width="1" />
<text x="70" y="181" text-anchor="start" class="label">FP64</text>
<text x="170" y="181" text-anchor="start" class="small">64 bit</text>
<rect x="268" y="160" width="80" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="308" y="181" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">S1</text>
<rect x="418" y="160" width="150" height="30" rx="6" ry="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
