<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.label { font-size: 15px; font-weight: 600; }
.small { font-size: 12px; fill: #6b7280; }
.note { font-size: 13px; fill: #6b7280; }
.axis { stroke: #9ca3af; stroke-width: 1.5; }
.card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
</style>
<defs>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" class="title">图4：范围 vs 精度：每种格式在取舍什么</text>
<text x="60" y="88" text-anchor="start" class="subtitle">横轴看尾数精度，纵轴看指数范围。越往右越“细”，越往上越“装得下大/小数”。</text>
<line x1="170" y1="650" x2="1050" y2="650" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<line x1="170" y1="650" x2="170" y2="150" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<text x="610" y="705" text-anchor="middle" class="label">尾数精度：小数细节越来越多 →</text>
<text x="70" y="410" text-anchor="middle" class="label">指数范围</text>
<text x="70" y="435" text-anchor="middle" class="label">越来越大 ↑</text>
<line x1="330" y1="650" x2="330" y2="150" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="490" y1="650" x2="490" y2="150" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="650" y1="650" x2="650" y2="150" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="810" y1="650" x2="810" y2="150" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="970" y1="650" x2="970" y2="150" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="170" y1="250" x2="1050" y2="250" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="170" y1="350" x2="1050" y2="350" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="170" y1="450" x2="1050" y2="450" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<line x1="170" y1="550" x2="1050" y2="550" stroke="#e5e7eb" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
<circle cx="960" cy="190" r="58" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="960" y="186" text-anchor="middle" class="label" fill="#16a34a">FP64</text>
<text x="960" y="210" text-anchor="middle" class="small">最稳最贵</text>
<circle cx="815" cy="255" r="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="815" y="251" text-anchor="middle" class="label" fill="#16a34a">FP32</text>
<text x="815" y="275" text-anchor="middle" class="small">标准高清</text>
<circle cx="590" cy="260" r="55" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="256" text-anchor="middle" class="label" fill="#2563eb">TF32</text>
<text x="590" y="280" text-anchor="middle" class="small">范围大/精度砍</text>
<circle cx="475" cy="285" r="55" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="475" y="281" text-anchor="middle" class="label" fill="#2563eb">BF16</text>
<text x="475" y="305" text-anchor="middle" class="small">范围大/较粗</text>
<circle cx="610" cy="435" r="55" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="610" y="431" text-anchor="middle" class="label" fill="#ea580c">FP16</text>
<text x="610" y="455" text-anchor="middle" class="small">较细/范围小</text>
<circle cx="375" cy="500" r="54" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="375" y="496" text-anchor="middle" class="label" fill="#dc2626">FP8</text>
<text x="375" y="520" text-anchor="middle" class="small">更快更省</text>
<circle cx="290" cy="560" r="56" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
<text x="290" y="556" text-anchor="middle" class="label" fill="#9333ea">NVFP4</text>
<text x="290" y="580" text-anchor="middle" class="small">4-bit 浮点</text>
<rect x="820" y="465" width="230" height="130" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="935" y="500" text-anchor="middle" class="label">INT8 / INT4</text>
<text x="935" y="530" text-anchor="middle" class="note">不是浮点，没有指数位</text>
<text x="935" y="556" text-anchor="middle" class="note">靠 scale 映射小数</text>
<text x="935" y="580" text-anchor="middle" class="note">主要用于量化推理</text>
<rect x="210" y="135" width="260" height="48" rx="10" ry="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" />
<text x="340" y="166" text-anchor="middle" class="note">低 bit 不等于不能用：关键在缩放、校准、硬件支持。</text>
</svg>