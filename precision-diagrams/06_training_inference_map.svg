<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1492 1054" width="1492" height="1054">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #0f172a; }
.title { font-size: 46px; font-weight: 800; letter-spacing: 0; }
.subtitle { font-size: 22px; fill: #475569; }
.h2 { font-size: 28px; font-weight: 800; }
.label { font-size: 22px; font-weight: 700; }
.body { font-size: 19px; fill: #0f172a; }
.small { font-size: 16px; fill: #475569; }
.tiny { font-size: 14px; fill: #475569; }
</style>
<defs>
  <marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#64748b"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#16a34a"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#ea580c"/></marker>
  <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.18"/></filter>
  <linearGradient id="costGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="50%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#fef2f2"/></linearGradient>
</defs>
<rect width="1492" height="1054" fill="#ffffff"/>
<text x="62" y="92" text-anchor="start" class="title">图6：训练和推理到底怎么选精度</text>
<text x="62" y="138" text-anchor="start" class="subtitle">训练更看重数值稳定，推理更看重速度、显存和吞吐；真正落地常常是混合使用。</text>
<rect x="58" y="172" width="660" height="742" rx="20" ry="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
<rect x="774" y="172" width="660" height="742" rx="20" ry="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
<text x="388" y="230" text-anchor="middle" class="h2" fill="#2563eb">训练 Training</text>
<text x="1104" y="230" text-anchor="middle" class="h2" fill="#9333ea">推理 Inference</text>
<rect x="118" y="278" width="540" height="82" rx="16" ry="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="150" y="314" text-anchor="start" class="label" fill="#16a34a">FP32 / TF32</text>
<text x="150" y="344" text-anchor="start" class="small">稳定基线，调试和部分关键计算</text>
<rect x="508" y="300" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.4" />
<text x="566" y="322" text-anchor="middle" class="small" fill="#16a34a">稳</text>
<line x1="388" y1="366" x2="388" y2="396" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="118" y="412" width="540" height="82" rx="16" ry="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="150" y="448" text-anchor="start" class="label" fill="#2563eb">BF16</text>
<text x="150" y="478" text-anchor="start" class="small">大模型训练主力：范围大，更不容易溢出</text>
<rect x="508" y="434" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" />
<text x="566" y="456" text-anchor="middle" class="small" fill="#2563eb">主力</text>
<line x1="388" y1="500" x2="388" y2="530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="118" y="546" width="540" height="82" rx="16" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="150" y="582" text-anchor="start" class="label" fill="#ea580c">FP16</text>
<text x="150" y="612" text-anchor="start" class="small">也常见：小数更细，但范围更小</text>
<rect x="508" y="568" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#ea580c" stroke-width="1.4" />
<text x="566" y="590" text-anchor="middle" class="small" fill="#ea580c">半精度</text>
<line x1="388" y1="634" x2="388" y2="664" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="118" y="680" width="540" height="82" rx="16" ry="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="150" y="716" text-anchor="start" class="label" fill="#dc2626">FP8</text>
<text x="150" y="746" text-anchor="start" class="small">新硬件上更激进：需 scale / 框架 / 硬件支持</text>
<rect x="508" y="702" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" />
<text x="566" y="724" text-anchor="middle" class="small" fill="#dc2626">激进</text>
<rect x="118" y="812" width="540" height="62" rx="16" ry="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
<text x="388" y="840" text-anchor="middle" class="body">关键累加 / 归一化 / 优化器状态</text>
<text x="388" y="864" text-anchor="middle" class="small">可能仍保留 FP32 或更高精度路径</text>
<rect x="834" y="278" width="540" height="82" rx="16" ry="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="866" y="314" text-anchor="start" class="label" fill="#16a34a">FP16 / BF16</text>
<text x="866" y="344" text-anchor="start" class="small">通用稳妥，部署门槛低</text>
<rect x="1224" y="300" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.4" />
<text x="1282" y="322" text-anchor="middle" class="small" fill="#16a34a">稳</text>
<line x1="1104" y1="366" x2="1104" y2="396" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="834" y="412" width="540" height="82" rx="16" ry="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="866" y="448" text-anchor="start" class="label" fill="#2563eb">FP8</text>
<text x="866" y="478" text-anchor="start" class="small">高吞吐路线：新 GPU 上更有优势</text>
<rect x="1224" y="434" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" />
<text x="1282" y="456" text-anchor="middle" class="small" fill="#2563eb">吞吐</text>
<line x1="1104" y1="500" x2="1104" y2="530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="834" y="546" width="540" height="82" rx="16" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="866" y="582" text-anchor="start" class="label" fill="#ea580c">INT8</text>
<text x="866" y="612" text-anchor="start" class="small">成熟量化：速度和显存收益明显</text>
<rect x="1224" y="568" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#ea580c" stroke-width="1.4" />
<text x="1282" y="590" text-anchor="middle" class="small" fill="#ea580c">成熟</text>
<line x1="1104" y1="634" x2="1104" y2="664" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="834" y="680" width="540" height="82" rx="16" ry="16" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#softShadow)"/>
<text x="866" y="716" text-anchor="start" class="label" fill="#9333ea">INT4 / NVFP4</text>
<text x="866" y="746" text-anchor="start" class="small">极致省显存：更依赖校准和缩放</text>
<rect x="1224" y="702" width="116" height="32" rx="16" ry="16" fill="#ffffff" stroke="#9333ea" stroke-width="1.4" />
<text x="1282" y="724" text-anchor="middle" class="small" fill="#9333ea">省显存</text>
<rect x="834" y="812" width="540" height="62" rx="16" ry="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
<text x="1104" y="840" text-anchor="middle" class="body">不是“推理都用 FP8”</text>
<text x="1104" y="864" text-anchor="middle" class="small">要看硬件、模型精度要求、显存和吞吐目标</text>
<rect x="98" y="948" width="1296" height="70" rx="18" ry="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<text x="136" y="992" text-anchor="start" class="label" fill="#2563eb">一句话：</text>
<text x="252" y="992" text-anchor="start" class="body">训练常用 BF16 但不是全程 BF16；推理可以用 FP8，但 FP16、BF16、INT8、INT4 仍然很常见。</text>
</svg>