<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.label { font-size: 15px; font-weight: 600; }
.small { font-size: 12px; fill: #6b7280; }
.note { font-size: 13px; fill: #6b7280; }
.axis { stroke: #9ca3af; stroke-width: 1.5; }
.card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
</style>
<defs>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" class="title">图5：INT8 / INT4 怎么表示小数</text>
<text x="60" y="88" text-anchor="start" class="subtitle">INT 本身只能存整数。AI 量化会加一个 scale：真实值 ≈ 整数 × scale。</text>
<rect x="160" y="130" width="880" height="82" rx="12" ry="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.3" />
<text x="600" y="183" text-anchor="middle" font-size="30" font-weight="700">真实值 ≈ 整数值 × scale</text>
<rect x="95" y="295" width="210" height="100" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
<text x="200.0" y="335" text-anchor="middle" class="label" fill="#16a34a">原始浮点数</text>
<text x="200.0" y="365" text-anchor="middle" class="note">0.00, 0.12, -0.35, 1.27</text>
<rect x="390" y="295" width="210" height="100" rx="12" ry="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
<text x="495.0" y="335" text-anchor="middle" class="label" fill="#9333ea">选择 scale</text>
<text x="495.0" y="365" text-anchor="middle" class="note">例如 scale = 0.01</text>
<rect x="685" y="295" width="210" height="100" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
<text x="790.0" y="335" text-anchor="middle" class="label" fill="#2563eb">变成整数</text>
<text x="790.0" y="365" text-anchor="middle" class="note">0, 12, -35, 127</text>
<rect x="980" y="295" width="135" height="100" rx="12" ry="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
<text x="1047.5" y="335" text-anchor="middle" class="label" fill="#dc2626">存储</text>
<text x="1047.5" y="365" text-anchor="middle" class="note">INT8</text>
<line x1="305" y1="345" x2="380" y2="345" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<line x1="600" y1="345" x2="675" y2="345" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<line x1="895" y1="345" x2="970" y2="345" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<text x="342" y="330" text-anchor="middle" class="small">除以 scale</text>
<text x="637" y="330" text-anchor="middle" class="small">四舍五入</text>
<text x="932" y="330" text-anchor="middle" class="small">压缩保存</text>
<path d="M 1048 405 L 1048 475 L 240 475 L 240 420" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
<text x="646" y="462" text-anchor="middle" class="note" fill="#16a34a">使用时再乘回 scale，近似还原成小数</text>
<rect x="125" y="555" width="420" height="105" rx="12" ry="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
<text x="335" y="590" text-anchor="middle" class="label" fill="#ea580c">INT8</text>
<text x="335" y="620" text-anchor="middle" class="note">有符号时大约 -128 到 127</text>
<text x="335" y="646" text-anchor="middle" class="note">256 个档位，量化比较成熟</text>
<rect x="655" y="555" width="420" height="105" rx="12" ry="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
<text x="865" y="590" text-anchor="middle" class="label" fill="#dc2626">INT4</text>
<text x="865" y="620" text-anchor="middle" class="note">有符号时大约 -8 到 7</text>
<text x="865" y="646" text-anchor="middle" class="note">只有 16 个档位，更省但更容易失真</text>
<rect x="250" y="690" width="700" height="42" rx="10" ry="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" />
<text x="600" y="717" text-anchor="middle" class="note">所以量化的核心不是“整数神奇地会表示小数”，而是“整数 + scale 一起表示小数”。</text>
</svg>