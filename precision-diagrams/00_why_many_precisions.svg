<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1492 1054" width="1492" height="1054">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #0f172a; }
.title { font-size: 46px; font-weight: 800; letter-spacing: 0; }
.subtitle { font-size: 22px; fill: #475569; }
.h2 { font-size: 28px; font-weight: 800; }
.label { font-size: 22px; font-weight: 700; }
.body { font-size: 19px; fill: #0f172a; }
.small { font-size: 16px; fill: #475569; }
.tiny { font-size: 14px; fill: #475569; }
</style>
<defs>
  <marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#64748b"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#16a34a"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#ea580c"/></marker>
  <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.18"/></filter>
  <linearGradient id="costGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="50%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#fef2f2"/></linearGradient>
</defs>
<rect width="1492" height="1054" fill="#ffffff"/>
<text x="62" y="92" text-anchor="start" class="title">图0：为什么有这么多精度？</text>
<text x="62" y="138" text-anchor="start" class="subtitle">用 π 做比喻：从高精度一路压缩，越省越快，但误差也越大。</text>
<rect x="58" y="174" width="1376" height="690" rx="20" ry="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
<rect x="92" y="214" width="606" height="598" rx="18" ry="18" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5" />
<rect x="794" y="214" width="606" height="598" rx="18" ry="18" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5" />
<text x="395" y="264" text-anchor="middle" class="h2">数学里的 π</text>
<text x="1097" y="264" text-anchor="middle" class="h2">AI 里的数字精度</text>
<rect x="132" y="315" width="518" height="82" rx="16" ry="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="172" cy="356" r="26" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
<text x="172" y="365" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">1</text>
<text x="220" y="351" text-anchor="start" font-size="28" font-weight="800">3.141592653589793</text>
<text x="220" y="379" text-anchor="start" class="small">很准，但成本更高</text>
<line x1="391" y1="403" x2="391" y2="431" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="132" y="437" width="518" height="82" rx="16" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="172" cy="478" r="26" fill="#ea580c" stroke="#ea580c" stroke-width="1.2"/>
<text x="172" y="487" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">2</text>
<text x="220" y="473" text-anchor="start" font-size="28" font-weight="800">3.1415926</text>
<text x="220" y="501" text-anchor="start" class="small">更准，记录更长</text>
<line x1="391" y1="525" x2="391" y2="553" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="132" y="559" width="518" height="82" rx="16" ry="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="172" cy="600" r="26" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/>
<text x="172" y="609" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">3</text>
<text x="220" y="595" text-anchor="start" font-size="28" font-weight="800">3.14</text>
<text x="220" y="623" text-anchor="start" class="small">日常够用</text>
<line x1="391" y1="647" x2="391" y2="675" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="132" y="681" width="518" height="82" rx="16" ry="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="172" cy="722" r="26" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
<text x="172" y="731" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">4</text>
<text x="220" y="717" text-anchor="start" font-size="28" font-weight="800">3</text>
<text x="220" y="745" text-anchor="start" class="small">最省，但很粗</text>
<text x="395" y="790" text-anchor="middle" class="label" fill="#2563eb">保留位数减少：更省，但误差更大</text>
<rect x="834" y="315" width="518" height="82" rx="16" ry="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="874" cy="356" r="26" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
<text x="874" y="365" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">1</text>
<text x="922" y="351" text-anchor="start" font-size="28" font-weight="800">FP64 / FP32</text>
<text x="922" y="379" text-anchor="start" class="small">高精度，稳但贵</text>
<line x1="1093" y1="403" x2="1093" y2="431" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="834" y="437" width="518" height="82" rx="16" ry="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="874" cy="478" r="26" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/>
<text x="874" y="487" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">2</text>
<text x="922" y="473" text-anchor="start" font-size="28" font-weight="800">BF16 / FP16</text>
<text x="922" y="501" text-anchor="start" class="small">训练常用，省一半</text>
<line x1="1093" y1="525" x2="1093" y2="553" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="834" y="559" width="518" height="82" rx="16" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="874" cy="600" r="26" fill="#ea580c" stroke="#ea580c" stroke-width="1.2"/>
<text x="874" y="609" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">3</text>
<text x="922" y="595" text-anchor="start" font-size="28" font-weight="800">FP8 / INT8</text>
<text x="922" y="623" text-anchor="start" class="small">更快更省，需校准</text>
<line x1="1093" y1="647" x2="1093" y2="675" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
<rect x="834" y="681" width="518" height="82" rx="16" ry="16" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#softShadow)"/>
<circle cx="874" cy="722" r="26" fill="#9333ea" stroke="#9333ea" stroke-width="1.2"/>
<text x="874" y="731" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">4</text>
<text x="922" y="717" text-anchor="start" font-size="28" font-weight="800">INT4 / NVFP4</text>
<text x="922" y="745" text-anchor="start" class="small">极致省显存，依赖 scale</text>
<text x="1097" y="790" text-anchor="middle" class="label" fill="#9333ea">总 bit 变少：更省、更快，但更容易失真</text>
<rect x="92" y="898" width="1308" height="96" rx="18" ry="18" fill="url(#costGrad)" stroke="#bfdbfe" stroke-width="1.5" />
<text x="132" y="956" text-anchor="start" class="label" fill="#2563eb">一句话总结：</text>
<text x="302" y="956" text-anchor="start" class="body">不是所有地方都需要“最长的 π”。高精度负责稳定，低精度负责省显存和提速度，混合精度负责两边兼顾。</text>
</svg>