<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; fill: #111827; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #6b7280; }
.label { font-size: 15px; font-weight: 600; }
.small { font-size: 12px; fill: #6b7280; }
.note { font-size: 13px; fill: #6b7280; }
.axis { stroke: #9ca3af; stroke-width: 1.5; }
.card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
</style>
<defs>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="58" text-anchor="start" class="title">图1：浮点数怎么“装”一个数字</text>
<text x="60" y="88" text-anchor="start" class="subtitle">把它想成二进制科学计数法：正负 × 有效数字 × 2 的多少次方</text>
<rect x="70" y="130" width="1060" height="120" rx="12" ry="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
<text x="110" y="178" text-anchor="start" class="label">十进制里：</text>
<text x="250" y="178" text-anchor="start" font-size="26" font-weight="700">-12345 = -1.2345 × 10⁴</text>
<text x="252" y="218" text-anchor="middle" class="small">负号</text>
<text x="462" y="218" text-anchor="middle" class="small">有效数字</text>
<text x="654" y="218" text-anchor="middle" class="small">指数：小数点移动 4 位</text>
<line x1="252" y1="184" x2="252" y2="203" stroke="#2563eb" stroke-width="1.5" fill="none"/>
<line x1="462" y1="184" x2="462" y2="203" stroke="#16a34a" stroke-width="1.5" fill="none"/>
<line x1="642" y1="184" x2="642" y2="203" stroke="#dc2626" stroke-width="1.5" fill="none"/>
<text x="60" y="292" text-anchor="start" class="label">计算机里：</text>
<rect x="120" y="330" width="120" height="78" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<rect x="240" y="330" width="350" height="78" rx="0" ry="0" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
<rect x="590" y="330" width="560" height="78" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
<text x="180" y="365" text-anchor="middle" class="label" fill="#2563eb">符号位</text>
<text x="180" y="388" text-anchor="middle" class="small">1 bit</text>
<text x="415" y="365" text-anchor="middle" class="label" fill="#dc2626">指数位</text>
<text x="415" y="388" text-anchor="middle" class="small">决定能表示多大 / 多小</text>
<text x="870" y="365" text-anchor="middle" class="label" fill="#16a34a">尾数位</text>
<text x="870" y="388" text-anchor="middle" class="small">决定小数细节有多准</text>
<text x="600" y="455" text-anchor="middle" font-size="24" font-weight="700">数值 ≈ (-1)^符号位 × 1.尾数 × 2^指数</text>
<rect x="170" y="525" width="240" height="120" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
<text x="290" y="565" text-anchor="middle" class="label" fill="#2563eb">符号位</text>
<text x="290" y="596" text-anchor="middle" class="note">像开关：</text>
<text x="290" y="620" text-anchor="middle" class="note">0 是正数，1 是负数</text>
<rect x="470" y="525" width="240" height="120" rx="12" ry="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
<text x="590" y="565" text-anchor="middle" class="label" fill="#dc2626">指数位</text>
<text x="590" y="596" text-anchor="middle" class="note">像变焦：</text>
<text x="590" y="620" text-anchor="middle" class="note">把小数点往左/右移动</text>
<rect x="770" y="525" width="240" height="120" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
<text x="890" y="565" text-anchor="middle" class="label" fill="#16a34a">尾数位</text>
<text x="890" y="596" text-anchor="middle" class="note">像清晰度：</text>
<text x="890" y="620" text-anchor="middle" class="note">保留多少有效数字</text>
<line x1="230" y1="408" x2="285" y2="520" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
<line x1="415" y1="408" x2="520" y2="520" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
<line x1="855" y1="408" x2="880" y2="520" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
</svg>